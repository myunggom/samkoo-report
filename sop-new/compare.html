<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안전 SOP 사진 개선 · 비용 보고</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#fff; --bg-sub:#fafafa; --bg-sunk:#f4f4f5;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
  --line:#e4e4e7; --line-2:#d4d4d8;
  --accent:#4a9b2f; --accent-sub:#eef6ea; --accent-ink:#2f6b1d;
  --warn:#b3261e; --warn-sub:#fdf0ef;
  --r:10px;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,
    'Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  font-size:15px; line-height:1.58; word-break:keep-all;
}
img{max-width:100%; display:block}
.wrap{max-width:1500px; margin:0 auto; padding:32px 28px 90px}

/* 머리 */
.top{border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:22px}
.logo{width:112px; margin-bottom:12px}
h1{margin:0 0 6px; font-size:26px; font-weight:800; letter-spacing:-.025em}
.sub{margin:0; color:var(--ink-2); font-size:14px; max-width:70ch}
.date{margin-top:8px; font-size:12.5px; color:var(--ink-3)}

/* 탭 */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line);
  margin-bottom:26px; overflow-x:auto}
.tabs button{
  flex:0 0 auto; appearance:none; cursor:pointer;
  padding:11px 16px; border:0; border-bottom:2px solid transparent;
  background:none; font:inherit; font-size:14px; font-weight:600;
  color:var(--ink-3); white-space:nowrap;
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tabs .prt{margin-left:auto; align-self:center; padding:6px 13px;
  border:1px solid var(--line); border-radius:7px; font-size:12.5px;
  color:var(--ink-2); border-bottom-width:1px}
.tabs .prt:hover{border-color:var(--accent); color:var(--accent-ink)}

/* 숫자 요약 */
.kpi{display:grid; gap:12px; grid-template-columns:repeat(4,1fr); margin:0 0 26px}
.k{border:1px solid var(--line); border-radius:var(--r); padding:15px 16px;
  background:var(--bg-sub)}
.k b{display:block; font-size:25px; font-weight:800; letter-spacing:-.02em;
  line-height:1.2; font-variant-numeric:tabular-nums}
.k span{display:block; font-size:12.5px; color:var(--ink-2); margin-top:3px}
.k em{display:block; font-style:normal; font-size:11.5px; color:var(--ink-3);
  margin-top:5px}
.k.good b{color:var(--accent-ink)}

h2{margin:34px 0 14px; font-size:17px; font-weight:700; letter-spacing:-.02em}
h2:first-child{margin-top:0}
.lede{margin:0 0 18px; color:var(--ink-2); font-size:13.5px; max-width:74ch}
.jump{display:none}

/* 비교 */
.cmp{display:grid; gap:18px; grid-template-columns:repeat(2,minmax(0,1fr))}
.item{border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  background:var(--bg-sub); break-inside:avoid}
.item .hd{display:flex; align-items:baseline; gap:8px; padding:11px 14px;
  border-bottom:1px solid var(--line); background:var(--bg)}
.item .no{font-size:12px; font-weight:800; color:var(--accent-ink);
  font-variant-numeric:tabular-nums}
.item .nm{font-size:14.5px; font-weight:700; letter-spacing:-.015em}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line)}
.half{background:var(--bg); position:relative}
.half img{width:100%; aspect-ratio:3/2; object-fit:cover}
.ph{aspect-ratio:3/2; display:grid; place-items:center; background:var(--bg-sunk)}
.ph span{font-size:12.5px; color:var(--ink-3)}
.tagp{position:absolute; top:7px; left:7px; padding:2px 8px; border-radius:5px;
  font-size:11px; font-weight:700; background:rgb(0 0 0 / .62); color:#fff;
  z-index:1}
.half.after .tagp{background:var(--accent)}
.half.after.wait .tagp{background:var(--ink-3)}
.fixed{padding:9px 14px; font-size:12.5px; color:var(--ink-2);
  border-top:1px solid var(--line)}
.fixed b{color:var(--accent-ink)}

/* 표 */
table{border-collapse:collapse; width:100%; font-size:13.5px;
  background:var(--bg); margin-bottom:4px}
th,td{border:1px solid var(--line); padding:9px 12px; text-align:left;
  vertical-align:top}
th{background:var(--bg-sunk); color:var(--ink-2); font-weight:700;
  white-space:nowrap}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
tr.sum td,tr.sum th{background:var(--accent-sub); font-weight:700;
  color:var(--accent-ink)}
.why{display:grid; gap:12px; grid-template-columns:repeat(3,1fr)}
.w{border:1px solid var(--line); border-radius:var(--r); padding:15px 16px;
  background:var(--bg-sub)}
.w h3{margin:0 0 6px; font-size:14px; font-weight:700}
.w p{margin:0; font-size:13px; color:var(--ink-2)}
.fine{margin-top:10px; font-size:12px; color:var(--ink-3); line-height:1.65}
.back{display:inline-block; margin-top:26px; font-size:13.5px;
  color:var(--accent-ink); text-decoration:none;
  border-bottom:1px solid currentColor}

@media (max-width:980px){
  .kpi{grid-template-columns:repeat(2,1fr)}
  .cmp{grid-template-columns:1fr}
  .why{grid-template-columns:1fr}
  .wrap{padding:22px 16px 70px}
}
@page{size:A4 landscape; margin:9mm}
@media print{
  body{font-size:9pt}
  .wrap{max-width:none; padding:0}
  .tabs,.back,.sub{display:none}
  .kpi{gap:3mm; margin-bottom:5mm}
  .k{padding:2mm 2.5mm}
  .k b{font-size:15pt}
  .cmp{gap:3mm}
  .item{break-inside:avoid}
  .why{gap:3mm}
  h1{font-size:16pt}
  h2{font-size:11pt; margin:5mm 0 2mm}
  table{font-size:8pt}
  th,td{padding:1.4mm 2mm}
  .pagebreak{break-before:page}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <img class="logo" src="assets/samkoo.png" alt="Samkoo">
    <h1>안전 표준운영절차 교육사진 개선 · 비용 보고</h1>
    <p class="sub">사람이 찍어 추려내던 교육자료 사진을 자동 생성으로 바꾼
      결과와, 거기에 들어간 돈을 정리했습니다. 위 탭으로 작업별 사진 비교와
      비용을 번갈아 볼 수 있습니다.</p>
    <div class="date">2026.10.26 ｜ 시설팀</div>
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view"></div>

  <a class="back" href="index.html">새 디자인 사이트로 돌아가기</a>
</div>

<script src="assets/data.js"></script>
<script src="assets/report.js"></script>
<script>
(function () {
  var R = window.REPORT;
  var tabs = document.getElementById('tabs');
  var view = document.getElementById('view');
  if (!R) { view.textContent = '자료를 불러오지 못했습니다.'; return; }

  /* 탭 : 작업별 사진 비교 + 비용 비교 */
  var 목록 = R.ids().map(function (id) {
    return [id, R.이름(id) + ' 사진'];
  }).concat([['cost', '비용 비교']]);

  var cur = (location.search.match(/[?&]t=([a-z0-9]+)/i) || [])[1];
  if (!cur || !목록.some(function (t) { return t[0] === cur; })) {
    cur = 목록[0][0];
  }

  function 왜() {
    return '<h2>무엇이 달라졌는가</h2><div class="why">' +
      '<div class="w"><h3>얼굴이 고정됐습니다</h3>' +
      '<p>기준 사진을 한 장만 넣던 것을 메인 · 보조자 각각 여러 각도로 ' +
      '만들어 모든 장면에 함께 넣었습니다. 두 사람이 나오는 장면에서도 ' +
      '서로 섞이지 않습니다.</p></div>' +
      '<div class="w"><h3>마스크를 벗었습니다</h3>' +
      '<p>얼굴이 흔들리는 것을 막으려고 마스크로 가려 왔습니다. 원인이 ' +
      '기준 사진 부족이었음을 확인하고, 마스크 없이도 같은 사람이 ' +
      '유지되게 했습니다.</p></div>' +
      '<div class="w"><h3>배경을 현실화했습니다</h3>' +
      '<p>어두운 영화 같은 분위기와 실제에 없는 설비를 금지하고, 천장 ' +
      '등기구가 켜진 밝은 설비실 · 국내 건물에서 쓰는 설비만 나오도록 ' +
      '지시문을 고쳤습니다.</p></div></div>';
  }

  function 그리기() {
    tabs.innerHTML = 목록.map(function (t) {
      return '<button role="tab" data-t="' + t[0] + '" aria-selected="' +
        (t[0] === cur) + '">' + t[1] + '</button>';
    }).join('') + '<button class="prt" id="btnPrint">인쇄 · PDF</button>';
    document.getElementById('btnPrint')
      .addEventListener('click', function () { window.print(); });

    if (cur === 'cost') {
      view.innerHTML = '<p class="lede">사진을 만드는 데 실제로 들어간 돈과, ' +
        '사람이 찍어 추려내던 방식과의 차이입니다. 인건비는 가정값임을 ' +
        '표 아래에 밝혔습니다.</p>' + R.비용표();
    } else {
      view.innerHTML = R.요약칸(cur) +
        '<p class="lede">' + R.요약글(cur) + '</p>' + 왜() +
        '<h2 class="pagebreak">사진 비교 : 왼쪽이 기존, 오른쪽이 개선</h2>' +
        '<div class="cmp">' + R.사진격자(cur) + '</div>';
    }
    window.scrollTo(0, 0);
  }

  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-t]');
    if (!b) return;
    cur = b.dataset.t;
    try {
      history.replaceState(null, '', 'compare.html?t=' + cur);
    } catch (err) {}
    그리기();
  });

  그리기();
})();
</script>
</body>
</html>
