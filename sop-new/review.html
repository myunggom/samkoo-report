<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SOP 사진 검수</title>
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f7f5; --card:#fff; --sunk:#eef0ec;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#8a8a93;
  --line:#e2e4df; --line-2:#cfd3cb;
  --ok:#2f7d1f; --ok-sub:#e8f4e3;
  --bad:#c0261c; --bad-sub:#fdecea;
  --redo:#9a6200; --redo-sub:#fff4dc;
  --accent:#4a9b2f;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121412; --card:#1b1e1b; --sunk:#232723;
    --ink:#ececea; --ink-2:#b4b6b0; --ink-3:#7d8079;
    --line:#2d322c; --line-2:#3c4239;
    --ok:#7ccf63; --ok-sub:#1d2e18;
    --bad:#ff7b70; --bad-sub:#3a1c19;
    --redo:#f0b54a; --redo-sub:#3a2c10;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',system-ui,sans-serif;
  font-size:15px;line-height:1.5;word-break:keep-all}
button{font:inherit;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1600px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}

/* 머리 */
.top>div{min-width:0}
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.sub{margin:0;color:var(--ink-2);font-size:14px;max-width:70ch}
.stats{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.stats{display:grid;grid-template-columns:1fr 1fr;width:100%}.stat{min-width:0}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;min-width:86px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--ink-3)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.redo b{color:var(--redo)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:4px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* 고르기 */
.ctl>*{min-width:0}
.ctl{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
select{font:inherit;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.save{margin-left:auto;font-size:13px;color:var(--ink-3)}
.save.err{color:var(--bad);font-weight:600}
.keys{font-size:12.5px;color:var(--ink-3)}
.who{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;width:9.5em}
.by{font-size:12.5px;color:var(--ink-3)}

/* 작업 묶음 */
.task{margin-bottom:34px}
.task h2{font-size:18px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.task h2 small{font-size:13px;font-weight:500;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.ok{border-color:var(--ok)} .card.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.ph{position:relative;background:var(--sunk);cursor:zoom-in;aspect-ratio:3/2}
.ph img{width:100%;height:100%;object-fit:contain}
.no{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.66);color:#fff;font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.mark{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px}
.mark.ok{background:var(--ok)} .mark.bad{background:var(--bad)}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.nm{font-weight:700;font-size:14.5px}
.bl{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
.redo{font-size:12.5px;background:var(--redo-sub);color:var(--redo);border-radius:6px;padding:4px 8px}
.redo details{margin-top:2px} .redo summary{cursor:pointer}

/* 판정 */
.pan{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:8px;cursor:pointer;font-weight:700;font-size:14px}
.btn.ok[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:active{transform:translateY(1px)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{border:1px solid var(--line-2);background:var(--card);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer}
.tag[aria-pressed=true]{background:var(--bad-sub);border-color:var(--bad);color:var(--bad);font-weight:600}
textarea{font:inherit;font-size:13.5px;width:100%;min-height:62px;resize:vertical;border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;background:var(--card);color:var(--ink)}
textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--ink-3)}
.empty{padding:60px 0;text-align:center;color:var(--ink-3)}

/* 크게 보기 */
.vw{position:fixed;inset:0;z-index:20;background:rgba(10,12,10,.92);display:grid;grid-template-columns:1fr 380px}
.vw[hidden]{display:none}
.vw .big{display:flex;align-items:center;justify-content:center;padding:16px;min-width:0;min-height:0;position:relative}
.vw .big img{max-height:calc(100vh - 32px);object-fit:contain}
.figw{position:relative;display:inline-block;max-width:100%;line-height:0}
.figw .mk{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#d9480f;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;line-height:1;box-shadow:0 0 0 2.5px #fff,0 2px 6px rgb(0 0 0 / .3)}
.fighint{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.vw .side{background:var(--card);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.vw .nav{display:flex;gap:6px}
.vw .nav button{flex:1;border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:7px;cursor:pointer}
.vw .where{font-size:12.5px;color:var(--ink-3)}
@media (max-width:860px){
  .vw{grid-template-columns:1fr;grid-template-rows:55vh 1fr}
  .vw .big img{max-height:calc(55vh - 32px)}
}
.foot{margin-top:30px;padding:16px;border:1px dashed var(--line-2);border-radius:var(--r);font-size:14px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>SOP 사진 검수</h1>
      <p class="sub">사진마다 <b>통과</b> 또는 <b>문제</b>를 고르고, 문제면 무엇이 틀렸는지 골라 적어 주세요.
        적은 내용은 바로 저장되고, 사진을 다시 만들 때 지시문에 그대로 들어갑니다.</p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="bar"><i id="barI"></i></div>

  <div class="ctl">
    <input id="who" class="who" maxlength="20" placeholder="검수자 이름" aria-label="검수자 이름">
    <select id="selTask" aria-label="작업 고르기"></select>
    <div class="chips" id="chips"></div>
    <span class="keys">사진을 누르면 크게 봅니다 · 크게 볼 때 <b>1</b> 통과 <b>2</b> 문제 <b>←/→</b> 이동</span>
    <span class="save" id="save">불러오는 중…</span>
  </div>

  <div id="list"></div>

  <div class="foot">
    검수를 마치면 Claude 에게 <b>"검수한 사진 다시 만들어 주세요"</b> 라고 말해 주세요.
    <b>문제</b>로 표시한 사진만, 골라 주신 항목과 적어 주신 내용을 지시문에 넣어 다시 만듭니다.
    다시 만든 사진은 노란 띠가 붙고 판정이 비워지니 한 번 더 봐 주세요.
  </div>
</div>

<div class="vw" id="vw" hidden>
  <div class="big" id="vwBig"></div>
  <div class="side" id="vwSide"></div>
</div>

<script src="assets/data.js"></script>
<script>
(function () {
  "use strict";
  var TAGS = ["팔·손만", "상반신만", "하반신만", "머리 잘림", "발 잘림", "사람 겹침",
    "사람 수 틀림", "설비가 다름", "보호구 틀림", "동작이 내용과 다름",
    "가짜 글자", "화면 나뉨", "어색함", "기타"];
  var API = "api/review";

  // ── 사진 목록 만들기 ────────────────────────────────────
  var order = (window.SITE && SITE.taskOrder) || Object.keys(window.TASKS || {});
  var tasks = [];
  order.forEach(function (tid) {
    var t = (window.TASKS || {})[tid];
    if (!t) return;
    var ph = [];
    (t.guide || []).forEach(function (sec) {
      (sec.items || []).forEach(function (it) {
        if (it.img) ph.push({ n: String(it.n), name: it.name, bullets: it.bullets || [], img: it.img, sec: sec.title });
      });
    });
    var p = t.parts || {};
    if (p.figure) ph.push({ n: "fig", name: "각부 명칭 도면", bullets: (p.items || []).map(function (x) { return x.n + ") " + x.name; }), img: p.figure, sec: "도면", marks: p.marks || [] });
    if (t.guideFigure) ph.push({ n: "gfig", name: "안전작업 지침 대표 사진", bullets: [], img: t.guideFigure, sec: "대표" });
    if (ph.length) tasks.push({ tid: tid, name: t.name, photos: ph });
  });
  var all = [];
  tasks.forEach(function (t) { t.photos.forEach(function (p) { p.tid = t.tid; p.task = t.name; all.push(p); }); });

  // ── 상태 ───────────────────────────────────────────────
  var R = {};                       // R[tid][n] = 기록
  var filt = { tid: "", st: "todo" };
  try { var sv = JSON.parse(localStorage.getItem("sopReviewFilt") || "null"); if (sv) filt = sv; } catch (e) {}
  var whoEl = document.getElementById("who");
  try { whoEl.value = localStorage.getItem("sopReviewer") || ""; } catch (e) {}
  whoEl.oninput = function () { try { localStorage.setItem("sopReviewer", whoEl.value.trim()); } catch (e) {} };
  whoEl.onkeydown = function (e) { e.stopPropagation(); };
  var view = null;                  // 크게 보는 사진의 순번(shown 안에서)
  var shown = [];

  function rec(p) { return (R[p.tid] || {})[p.n] || {}; }
  function st(p) { var r = rec(p); return r.s || "todo"; }

  // ── 저장 (한 번에 하나씩 차례로 보낸다. 서버는 사진마다 따로 저장해 서로 지우지 않는다) ─────
  var queue = Promise.resolve(), pending = 0;
  var saveEl = document.getElementById("save");
  function showSave(msg, err) { saveEl.textContent = msg; saveEl.className = "save" + (err ? " err" : ""); }
  function save(p) {
    var r = rec(p);
    var payload = { tid: p.tid, n: p.n, s: r.s || "", tags: r.tags || [], note: r.note || "", by: whoEl.value.trim() };
    R[p.tid][p.n].by = payload.by;
    pending++; showSave("저장 중…");
    queue = queue.then(function () {
      return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
        .then(function (res) { return res.json().then(function (j) { if (!res.ok) throw new Error(j.error || res.status); return j; }); })
        .then(function () { pending--; if (!pending) showSave("저장됨 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })); })
        .catch(function (e) { pending--; showSave("저장 실패 — " + e.message + " (다시 눌러 주세요)", true); });
    });
  }
  function setRec(p, patch) {
    R[p.tid] = R[p.tid] || {};
    var r = R[p.tid][p.n] = Object.assign({}, R[p.tid][p.n] || {}, patch);
    if (r.s !== "bad") r.tags = [];
  }

  // ── 판정 칸 (카드와 크게 보기에서 같이 쓴다) ───────────────
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function panel(p, onChange) {
    var r = rec(p), box = el("div", "pan");
    var btns = el("div", "btns");
    [["ok", "✓ 통과"], ["bad", "✗ 문제"]].forEach(function (b) {
      var x = el("button", "btn " + b[0], b[1]);
      x.type = "button";
      x.setAttribute("aria-pressed", r.s === b[0]);
      x.onclick = function () { judge(p, r.s === b[0] ? "" : b[0]); onChange(); };
      btns.appendChild(x);
    });
    box.appendChild(btns);
    if (r.s && r.by) box.appendChild(el("div", "by", "판정 : " + esc(r.by)));
    if (r.s === "bad") {
      var tg = el("div", "tags");
      TAGS.forEach(function (t) {
        var on = (r.tags || []).indexOf(t) >= 0;
        var x = el("button", "tag", esc(t));
        x.type = "button"; x.setAttribute("aria-pressed", on);
        x.onclick = function () {
          var cur = (rec(p).tags || []).slice();
          if (on) cur.splice(cur.indexOf(t), 1); else cur.push(t);
          setRec(p, { tags: cur }); save(p); onChange();
        };
        tg.appendChild(x);
      });
      box.appendChild(tg);
    }
    if (r.s === "bad" || r.note) {
      var ta = el("textarea");
      ta.placeholder = "무엇이 문제인지, 어떻게 고치면 되는지 적어 주세요. 예) 보조자가 주인공 뒤에 숨어 있음. 둘이 나란히 서게.";
      ta.value = r.note || "";
      var tmr;
      ta.oninput = function () { setRec(p, { note: ta.value }); clearTimeout(tmr); tmr = setTimeout(function () { tmr = null; save(p); }, 900); };
      ta.onblur = function () { if (tmr) { clearTimeout(tmr); tmr = null; save(p); } };
      ta.onkeydown = function (e) { e.stopPropagation(); };
      box.appendChild(ta);
      if (r.s === "bad") box.appendChild(el("div", "hint", "적은 글이 그대로 사진 지시문에 들어갑니다. 장비 모양이 틀렸으면 <b>설비가 다름</b>도 꼭 골라 주세요. 그래야 도면부터 고쳐 그립니다."));
    }
    return box;
  }
  function judge(p, s) { setRec(p, { s: s }); save(p); paintStats(); }

  function redoNote(p) {
    var r = rec(p);
    if (!r.redo) return null;
    var h = (r.history || [])[r.history.length - 1];
    var d = el("div", "redo", "다시 만든 사진 (" + r.redo + "회) — 한 번 더 봐 주세요");
    if (h) {
      var det = el("details");
      det.innerHTML = "<summary>지난번 지적 보기</summary>" + esc((h.tags || []).join(", ")) + (h.note ? " — " + esc(h.note) : "");
      d.appendChild(det);
    }
    return d;
  }
  function src(p) { var r = rec(p); return "assets/img/" + p.img + (r.redoneAt ? "?v=" + encodeURIComponent(r.redoneAt) : ""); }
  function label(p) { return /^\d+$/.test(p.n) ? p.n + "번" : p.n === "fig" ? "도면" : "대표"; }

  // ── 카드 ────────────────────────────────────────────────
  function card(p, idx) {
    var s = st(p), c = el("div", "card " + (s === "todo" ? "" : s));
    var ph = el("div", "ph");
    var im = el("img"); im.loading = "lazy"; im.alt = p.task + " " + label(p) + " " + p.name; im.src = src(p);
    ph.appendChild(im);
    ph.appendChild(el("span", "no", esc(p.tid + " · " + label(p))));
    if (s !== "todo") ph.appendChild(el("span", "mark " + s, s === "ok" ? "✓" : "✗"));
    ph.onclick = function () { openView(idx); };
    c.appendChild(ph);
    var b = el("div", "body");
    b.appendChild(el("div", "nm", esc(p.name)));
    if (p.bullets.length) b.appendChild(el("ul", "bl", p.bullets.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("")));
    if (p.n === "fig") b.appendChild(el("div", "fighint", p.marks.length
      ? "번호는 사이트가 사진 위에 얹습니다. 사진을 눌러 크게 보면 번호가 보입니다. 위치가 틀리면 메모에 적어 주세요."
      : "이 도면은 아직 번호 위치가 정해지지 않았습니다. 번호 없음은 따로 처리하니 장비 모양만 봐 주세요."));
    var rn = redoNote(p); if (rn) b.appendChild(rn);
    b.appendChild(panel(p, function () { var nc = card(p, idx); c.replaceWith(nc); }));
    c.appendChild(b);
    return c;
  }

  // ── 그리기 ──────────────────────────────────────────────
  var list = document.getElementById("list");
  function pass(p) {
    if (filt.tid && p.tid !== filt.tid) return false;
    var s = st(p);
    if (filt.st === "all") return true;
    if (filt.st === "redo") return !!rec(p).redo && s === "todo";
    return s === filt.st;
  }
  function paint() {
    try { localStorage.setItem("sopReviewFilt", JSON.stringify(filt)); } catch (e) {}
    list.innerHTML = ""; shown = [];
    tasks.forEach(function (t) {
      var ps = t.photos.filter(pass);
      if (!ps.length) return;
      var done = t.photos.filter(function (p) { return st(p) !== "todo"; }).length;
      var bad = t.photos.filter(function (p) { return st(p) === "bad"; }).length;
      var sec = el("section", "task");
      sec.appendChild(el("h2", "", esc(t.name) + " <small>" + t.tid + " · 검수 " + done + "/" + t.photos.length + (bad ? " · 문제 " + bad : "") + "</small>"));
      var g = el("div", "grid");
      ps.forEach(function (p) { var i = shown.length; shown.push(p); g.appendChild(card(p, i)); });
      sec.appendChild(g); list.appendChild(sec);
    });
    if (!shown.length) list.appendChild(el("div", "empty", filt.st === "todo" ? "이 범위에서 검수할 사진을 다 봤습니다." : "해당하는 사진이 없습니다."));
    paintStats(); paintCtl();
  }
  function paintStats() {
    var n = { ok: 0, bad: 0, todo: 0, redo: 0 };
    all.forEach(function (p) { var s = st(p); n[s]++; if (rec(p).redo && s === "todo") n.redo++; });
    var done = n.ok + n.bad;
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>' + done + " / " + all.length + "</b><span>검수함</span></div>" +
      '<div class="stat ok"><b>' + n.ok + "</b><span>통과</span></div>" +
      '<div class="stat bad"><b>' + n.bad + "</b><span>문제</span></div>" +
      '<div class="stat redo"><b>' + n.redo + "</b><span>다시 만든 것 · 볼 차례</span></div>";
    document.getElementById("barI").style.width = (all.length ? done / all.length * 100 : 0) + "%";
  }
  var selTask = document.getElementById("selTask"), chips = document.getElementById("chips");
  function paintCtl() {
    var cur = filt.tid;
    selTask.innerHTML = '<option value="">작업 전체 (' + tasks.length + "건)</option>" + tasks.map(function (t) {
      var left = t.photos.filter(function (p) { return st(p) === "todo"; }).length;
      return '<option value="' + t.tid + '"' + (t.tid === cur ? " selected" : "") + ">" + t.tid + " " + esc(t.name) + (left ? " — 남은 " + left : " — 끝") + "</option>";
    }).join("");
    chips.innerHTML = "";
    [["todo", "아직 안 본 것"], ["bad", "문제"], ["ok", "통과"], ["redo", "다시 만든 것"], ["all", "전부"]].forEach(function (c) {
      var b = el("button", "chip", c[1]); b.type = "button";
      b.setAttribute("aria-pressed", filt.st === c[0]);
      b.onclick = function () { filt.st = c[0]; paint(); };
      chips.appendChild(b);
    });
  }
  selTask.onchange = function () { filt.tid = selTask.value; paint(); window.scrollTo(0, 0); };

  // ── 크게 보기 ───────────────────────────────────────────
  var vw = document.getElementById("vw"), vwBig = document.getElementById("vwBig"), vwSide = document.getElementById("vwSide");
  function openView(i) { view = i; vw.hidden = false; document.body.style.overflow = "hidden"; paintView(); }
  function closeView() { vw.hidden = true; document.body.style.overflow = ""; view = null; paint(); }
  function paintView() {
    var p = shown[view]; if (!p) return closeView();
    vwBig.innerHTML = ""; var im = el("img"); im.src = src(p); im.alt = p.name;
    if (p.n === "fig") {
      // 본 SOP 화면처럼 번호를 사진 위에 얹어 보여 준다 (사진에는 번호를 그리지 않는다)
      var w = el("span", "figw"); w.appendChild(im);
      (p.marks || []).forEach(function (m) { var k = el("span", "mk", String(m.n)); k.style.left = m.x + "%"; k.style.top = m.y + "%"; w.appendChild(k); });
      vwBig.appendChild(w);
    } else vwBig.appendChild(im);
    vwSide.innerHTML = "";
    var nav = el("div", "nav");
    [["← 앞", -1], ["다음 →", 1], ["닫기 (Esc)", 0]].forEach(function (b) {
      var x = el("button", "", b[0]); x.type = "button";
      x.onclick = function () { if (!b[1]) closeView(); else move(b[1]); };
      nav.appendChild(x);
    });
    vwSide.appendChild(nav);
    vwSide.appendChild(el("div", "where", esc(p.tid + " " + p.task + " · " + label(p) + " · " + (view + 1) + " / " + shown.length)));
    vwSide.appendChild(el("div", "nm", esc(p.name)));
    if (p.bullets.length) vwSide.appendChild(el("ul", "bl", p.bullets.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("")));
    var rn = redoNote(p); if (rn) vwSide.appendChild(rn);
    vwSide.appendChild(panel(p, paintView));
  }
  function move(d) { var j = view + d; if (j >= 0 && j < shown.length) { view = j; paintView(); } }
  document.addEventListener("keydown", function (e) {
    if (vw.hidden) return;
    if (e.key === "Escape") closeView();
    else if (e.key === "ArrowRight") move(1);
    else if (e.key === "ArrowLeft") move(-1);
    else if (e.key === "1") { judge(shown[view], "ok"); paintView(); setTimeout(function () { move(1); }, 150); }
    else if (e.key === "2") { var p = shown[view]; if (st(p) !== "bad") judge(p, "bad"); paintView(); var ta = vwSide.querySelector("textarea"); if (ta) ta.focus(); }
  });
  vwBig.addEventListener("click", function (e) { if (e.target === vwBig) closeView(); });

  // ── 시작 ────────────────────────────────────────────────
  paint();
  fetch(API, { cache: "no-store" })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); })
    .then(function (j) { R = j.reviews || {}; showSave("불러옴"); paint(); })
    .catch(function (e) { showSave("검수 기록을 못 불러왔습니다 — " + e.message, true); });
})();
</script>
</body>
</html>
