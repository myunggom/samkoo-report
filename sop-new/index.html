<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안전 표준운영절차</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ────────────────────────────────────────────────────────────────
   색은 무채색 한 계열 + 포인트 1색(삼구 녹색)만 쓴다.
   포인트색은 '지금 어디에 있는지' 와 '반드시 지킬 것' 에만.
   ──────────────────────────────────────────────────────────────── */
:root{
  --bg:#ffffff;           --bg-sub:#fafafa;      --bg-sunk:#f4f4f5;
  --ink:#18181b;          --ink-2:#52525b;       --ink-3:#a1a1aa;
  --line:#e4e4e7;         --line-2:#d4d4d8;
  --accent:#4a9b2f;       --accent-sub:#eef6ea;  --accent-ink:#2f6b1d;
  --warn:#b3261e;         --warn-sub:#fdf0ef;
  --r:10px;
  --sidebar:276px;
  --tap:44px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#121214;         --bg-sub:#18181b;      --bg-sunk:#1f1f23;
    --ink:#f4f4f5;        --ink-2:#a1a1aa;       --ink-3:#71717a;
    --line:#27272a;       --line-2:#3f3f46;
    --accent:#7cc45f;     --accent-sub:#1c2a16;  --accent-ink:#9fd686;
    --warn:#f2938c;       --warn-sub:#2a1816;
  }
}
:root[data-theme="dark"]{
  --bg:#121214;           --bg-sub:#18181b;      --bg-sunk:#1f1f23;
  --ink:#f4f4f5;          --ink-2:#a1a1aa;       --ink-3:#71717a;
  --line:#27272a;         --line-2:#3f3f46;
  --accent:#7cc45f;       --accent-sub:#1c2a16;  --accent-ink:#9fd686;
  --warn:#f2938c;         --warn-sub:#2a1816;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,
    'Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
  word-break:keep-all;
}
img{max-width:100%; display:block}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
a{color:inherit}

/* ───────── 뼈대 : 좌측 고정 + 본문 ───────── */
.shell{display:grid; grid-template-columns:var(--sidebar) 1fr; min-height:100dvh}

/* ───────── 좌측 ───────── */
.side{
  position:sticky; top:0; height:100dvh; overflow-y:auto;
  background:var(--bg-sub); border-right:1px solid var(--line);
  display:flex; flex-direction:column;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:18px 18px 14px; border-bottom:1px solid var(--line);
}
.brand b{font-size:15px; font-weight:700; letter-spacing:-.01em}
.brand span{display:block; font-size:11.5px; color:var(--ink-3); font-weight:500}
.mark{
  width:26px; height:26px; border-radius:7px; flex:none;
  background:var(--accent); color:#fff;
  display:grid; place-items:center; font-size:13px; font-weight:800;
}
.find{padding:12px 14px}
.find input{
  width:100%; height:38px; padding:0 12px;
  background:var(--bg); color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r);
  font-size:14px;
}
.find input::placeholder{color:var(--ink-3)}
.find input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}

.tree{flex:1; padding:0 8px 24px}
.grp{margin-bottom:2px}
.grp>button{
  width:100%; display:flex; align-items:center; gap:8px;
  padding:9px 10px; border-radius:8px;
  font-size:12.5px; font-weight:700; color:var(--ink-2);
  letter-spacing:-.01em; text-align:left;
}
.grp>button:hover{background:var(--bg-sunk)}
.grp>button .caret{
  margin-left:auto; color:var(--ink-3); font-size:11px;
  transition:transform .15s ease;
}
.grp[open]>button .caret{transform:rotate(90deg)}
.grp .list{padding:2px 0 8px}
.grp .list a{
  display:block; padding:8px 10px 8px 18px; border-radius:8px;
  font-size:13.5px; color:var(--ink-2); text-decoration:none;
  letter-spacing:-.01em;
  border-left:2px solid transparent;
}
.grp .list a:hover{background:var(--bg-sunk); color:var(--ink)}
.grp .list a[aria-current="true"]{
  background:var(--accent-sub); color:var(--accent-ink);
  border-left-color:var(--accent); font-weight:700;
}

/* ───────── 본문 ───────── */
.main{min-width:0; display:flex; flex-direction:column}
.bar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:980px; margin:0 auto; padding:0 28px}
.crumb{
  display:flex; align-items:center; gap:7px;
  padding:14px 0 0; font-size:12px; color:var(--ink-3);
}
h1{
  margin:4px 0 2px; font-size:26px; font-weight:800;
  letter-spacing:-.025em; line-height:1.25;
}
.meta{display:flex; flex-wrap:wrap; gap:14px; padding-bottom:12px;
  font-size:12.5px; color:var(--ink-2)}
.meta b{font-weight:600; color:var(--ink-3)}

.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  position:relative; white-space:nowrap;
  padding:11px 14px; font-size:14px; font-weight:600;
  color:var(--ink-3); border-bottom:2px solid transparent;
  min-height:var(--tap);
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

.body{max-width:980px; margin:0 auto; padding:26px 28px 96px; width:100%}
h2{
  margin:34px 0 14px; font-size:16px; font-weight:700;
  letter-spacing:-.015em; color:var(--ink);
}
h2:first-child{margin-top:0}
.lede{margin:0 0 20px; color:var(--ink-2); font-size:14.5px; max-width:62ch}

/* 각부 명칭 : 도면 + 번호 목록 */
.fig{
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--bg-sunk); overflow:hidden;
}
.fig img{width:100%; height:auto}
.fig figcaption{
  padding:9px 14px; font-size:12.5px; color:var(--ink-2);
  border-top:1px solid var(--line); background:var(--bg-sub);
}
.parts{margin:18px 0 0; padding:0; list-style:none; border-top:1px solid var(--line)}
.parts li{display:flex; gap:13px; padding:13px 2px; border-bottom:1px solid var(--line)}
.num{
  flex:none; width:25px; height:25px; border-radius:50%;
  background:var(--bg-sunk); color:var(--ink-2);
  display:grid; place-items:center;
  font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;
}
.parts .nm{font-size:14.5px; font-weight:600; letter-spacing:-.01em}
.parts .ds{font-size:13.5px; color:var(--ink-2); margin-top:2px}

/* 점검 상자 3칸 */
.notes{display:grid; gap:12px; grid-template-columns:repeat(3,1fr); margin-top:20px}
.note{border:1px solid var(--line); border-radius:var(--r); padding:14px 15px; background:var(--bg-sub)}
.note.ban{border-color:color-mix(in srgb,var(--warn) 35%,var(--line)); background:var(--warn-sub)}
.note h3{margin:0 0 9px; font-size:12.5px; font-weight:700; color:var(--ink-2)}
.note.ban h3{color:var(--warn)}
.note ul{margin:0; padding-left:16px; font-size:13.5px; color:var(--ink-2)}
.note li+li{margin-top:5px}

/* 교육자료 : 사진 1 + 문장 2~3 */
.steps{display:grid; gap:14px}
.step{
  display:grid; grid-template-columns:168px 1fr; gap:16px;
  border:1px solid var(--line); border-radius:var(--r);
  padding:14px; background:var(--bg-sub);
}
.step.must{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.shot{
  width:100%; aspect-ratio:4/3; object-fit:cover;
  border-radius:7px; border:1px solid var(--line); background:var(--bg-sunk);
}
.step-h{display:flex; align-items:center; gap:9px; margin-bottom:7px; flex-wrap:wrap}
.step-h .nm{font-size:15px; font-weight:700; letter-spacing:-.015em}
.tag{
  font-size:11px; font-weight:700; padding:2px 7px; border-radius:5px;
  background:var(--accent-sub); color:var(--accent-ink);
}
.tag.w{background:var(--warn-sub); color:var(--warn)}
.step ul{margin:0; padding-left:16px; font-size:14px; color:var(--ink-2)}
.step li+li{margin-top:4px}

/* 보호구 */
.ppe{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px}
.ppe .it{
  flex:0 1 124px; text-align:center; padding:12px 8px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--bg-sub);
}
.ppe img{height:46px; width:auto; margin:0 auto 8px; object-fit:contain}
.ppe span{font-size:12.5px; font-weight:600; white-space:nowrap}

/* 위험성평가 */
.step.rk{grid-template-columns:1fr 128px}
.rk-g{display:grid; gap:14px; grid-template-columns:repeat(3,1fr); margin-top:4px}
.rk-g h3{margin:0 0 5px; font-size:11.5px; font-weight:700; color:var(--ink-3)}
.rk-g ul{margin:0; padding-left:15px; font-size:13px; color:var(--ink-2)}
.rk-g li+li{margin-top:3px}
.rk-r{display:flex; flex-direction:column; align-items:center; gap:4px;
  justify-content:center; border-left:1px solid var(--line); padding-left:14px}
.score{text-align:center}
.score b{display:block; font-size:24px; font-weight:800; line-height:1.1;
  font-variant-numeric:tabular-nums; color:var(--warn)}
.score.ok b{color:var(--accent-ink)}
.score span{display:block; font-size:11px; color:var(--ink-3)}
.score em{font-style:normal; font-size:11px; color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.arrow{color:var(--ink-3); font-size:13px; line-height:1}
.due{margin-top:6px; font-size:11.5px; color:var(--ink-2);
  background:var(--bg-sunk); padding:2px 8px; border-radius:5px}

/* 완료보고서 */
.shots{display:grid; gap:12px; grid-template-columns:repeat(4,1fr)}
.drop{
  display:grid; place-items:center; gap:3px; cursor:pointer;
  aspect-ratio:4/3; border:1px dashed var(--line-2); border-radius:var(--r);
  background:var(--bg-sub); text-align:center; padding:10px;
}
.drop:hover{border-color:var(--accent); background:var(--accent-sub)}
.drop .plus{font-size:21px; color:var(--ink-3); line-height:1}
.drop b{font-size:13.5px; font-weight:600}
.drop em{font-style:normal; font-size:11.5px; color:var(--ink-3)}
.sign{display:grid; gap:12px; grid-template-columns:repeat(2,1fr)}
.sg{border:1px solid var(--line); border-radius:var(--r); padding:14px; background:var(--bg-sub)}
.sg h3{margin:0 0 9px; font-size:12.5px; font-weight:700; color:var(--ink-2)}
.pad{height:84px; border:1px dashed var(--line-2); border-radius:7px;
  display:grid; place-items:center; color:var(--ink-3); font-size:13px;
  background:var(--bg)}
.who{margin-top:8px; font-size:13px; color:var(--ink-2)}
.act{margin-top:22px}
.btn{
  min-height:var(--tap); padding:0 20px; border-radius:var(--r);
  background:var(--accent); color:#fff; font-size:15px; font-weight:700;
}
.btn:hover{filter:brightness(.94)}
.btn:active{transform:translateY(1px)}

/* 빈 상태 */
.empty{
  border:1px dashed var(--line-2); border-radius:var(--r);
  padding:44px 24px; text-align:center; color:var(--ink-3);
}
.empty b{display:block; color:var(--ink-2); font-size:15px; margin-bottom:5px}

/* 모바일 */
.mob{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{
    position:fixed; inset:0 auto 0 0; width:84vw; max-width:320px; z-index:50;
    transform:translateX(-100%); transition:transform .2s ease;
    box-shadow:0 0 0 100vmax rgb(0 0 0 / 0);
  }
  body.open .side{transform:none}
  body.open::after{
    content:""; position:fixed; inset:0; z-index:40; background:rgb(0 0 0 / .4);
  }
  .mob{
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30; background:var(--bg);
  }
  .mob button{
    min-height:var(--tap); min-width:var(--tap);
    display:grid; place-items:center; border:1px solid var(--line);
    border-radius:9px;
  }
  .bar-in,.body{padding-left:16px; padding-right:16px}
  h1{font-size:21px}
  .notes{grid-template-columns:1fr}
  .step.rk{grid-template-columns:1fr}
  .rk-g{grid-template-columns:1fr}
  .rk-r{border-left:0; border-top:1px solid var(--line); padding:12px 0 0;
    flex-direction:row; gap:16px}
  .shots{grid-template-columns:repeat(2,1fr)}
  .sign{grid-template-columns:1fr}
  .step{grid-template-columns:1fr}
  .shot{aspect-ratio:16/9}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>

<div class="mob">
  <button id="menu" aria-label="작업 목록 열기">☰</button>
  <b style="font-size:14px">안전 표준운영절차</b>
</div>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">S</div>
      <div>
        <b>안전 표준운영절차</b>
        <span id="org"></span>
      </div>
    </div>
    <div class="find">
      <input id="q" type="search" placeholder="작업 찾기" autocomplete="off">
    </div>
    <nav class="tree" id="tree"></nav>
  </aside>

  <main class="main">
    <div class="bar">
      <div class="bar-in">
        <div class="crumb" id="crumb"></div>
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
        <div class="tabs" id="tabs" role="tablist"></div>
      </div>
    </div>
    <div class="body" id="view"></div>
  </main>
</div>

<script src="assets/data.js"></script>
<script>
(function () {
  var IMG = 'assets/img/';
  var T = window.TASKS || {}, S = window.SITE || {};
  var tree = document.getElementById('tree');
  var view = document.getElementById('view');
  var tabs = document.getElementById('tabs');
  var cur = null, tab = 'parts';

  var TABS = [
    ['parts', '각부 명칭'],
    ['guide', '안전작업 지침'],
    ['risk', '위험성평가'],
    ['report', '완료보고서']
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function img(n) { return n ? IMG + n : ''; }

  document.getElementById('org').textContent = S.org || '';

  /* ── 좌측 목록 ── */
  function drawTree(filter) {
    var f = (filter || '').trim();
    tree.innerHTML = '';
    (S.groups || []).forEach(function (g, gi) {
      var ids = [];
      (g.chapters || []).forEach(function (c) {
        (c.tasks || []).forEach(function (id) { if (T[id]) ids.push(id); });
      });
      if (f) {
        ids = ids.filter(function (id) {
          return (T[id].name || '').indexOf(f) >= 0;
        });
      }
      if (!ids.length) return;
      var d = document.createElement('details');
      d.className = 'grp';
      if (f || gi === 1) d.open = true;
      var sum = '<button type="button">' + esc(g.title) +
        '<span class="caret">&#9656;</span></button>';
      var list = ids.map(function (id) {
        return '<a href="#' + id + '" data-id="' + id + '"' +
          (id === cur ? ' aria-current="true"' : '') + '>' +
          esc(T[id].name) + '</a>';
      }).join('');
      d.innerHTML = '<summary style="list-style:none">' + sum + '</summary>' +
        '<div class="list">' + list + '</div>';
      tree.appendChild(d);
    });
  }

  /* ── 탭 ── */
  function drawTabs() {
    tabs.innerHTML = TABS.map(function (t) {
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' +
        (t[0] === tab) + '">' + t[1] + '</button>';
    }).join('');
  }

  /* ── 본문 ── */
  function partsView(t) {
    var p = t.parts || {}, h = '';
    if (p.figure) {
      h += '<figure class="fig" style="margin:0"><img src="' + img(p.figure) +
        '" alt="">' + (p.figureCaption ?
          '<figcaption>' + esc(p.figureCaption) + '</figcaption>' : '') +
        '</figure>';
    }
    if ((p.items || []).length) {
      h += '<ul class="parts">' + p.items.map(function (it) {
        return '<li><span class="num">' + esc(it.n) + '</span><div>' +
          '<div class="nm">' + esc(it.name) + '</div>' +
          (it.desc ? '<div class="ds">' + esc(it.desc) + '</div>' : '') +
          '</div></li>';
      }).join('') + '</ul>';
    }
    var box = [['pre', '작업 전 점검', ''], ['use', '사용 기준', ''],
               ['ban', '금지 사항', 'ban']];
    var got = box.filter(function (b) { return (p[b[0]] || []).length; });
    if (got.length) {
      h += '<div class="notes">' + got.map(function (b) {
        return '<div class="note ' + b[2] + '"><h3>' + b[1] + '</h3><ul>' +
          p[b[0]].map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
          '</ul></div>';
      }).join('') + '</div>';
    }
    h += '<h2>작업별 필수 개인보호구</h2><div class="ppe">' +
      (t.ppe || []).map(function (q) {
        return '<div class="it"><img src="' + img(q.img) + '" alt="">' +
          '<span>' + esc(q.name) + '</span></div>';
      }).join('') + '</div>';
    return h || empty('각부 명칭 자료가 아직 없습니다.');
  }

  function guideView(t) {
    var secs = t.guide || [];
    if (!secs.length) return empty('교육자료가 아직 없습니다.');
    return secs.map(function (s) {
      return '<h2>' + esc(s.title) + '</h2><div class="steps">' +
        (s.items || []).map(function (it) {
          return '<div class="step' + (it.must ? ' must' : '') + '">' +
            '<img class="shot" src="' + img(it.img) + '" alt="" loading="lazy">' +
            '<div><div class="step-h"><span class="num">' + esc(it.n) +
            '</span><span class="nm">' + esc(it.name) + '</span>' +
            (it.must ? '<span class="tag">필수</span>' : '') +
            (it.warn ? '<span class="tag w">' + esc(it.warn) + '</span>' : '') +
            '</div><ul>' +
            (it.bullets || []).map(function (b) {
              return '<li>' + esc(b) + '</li>';
            }).join('') + '</ul></div></div>';
        }).join('') + '</div>';
    }).join('');
  }

  function empty(msg) {
    return '<div class="empty"><b>' + esc(msg) + '</b>' +
      '이 작업에는 아직 자료가 없습니다.</div>';
  }

  /* 위험성평가 : 빈도 x 강도. 숫자는 표가 아니라 칩으로 읽힌다. */
  function riskView(t) {
    var r = t.risk || {}, rows = r.rows || [];
    if (!rows.length) return empty('위험성평가표');
    var h = '<p class="lede">빈도 × 강도로 위험도를 매기고, 조치 후 남는 위험을 다시 적습니다.' +
      (r.target ? ' 대상 : ' + esc(r.target) : '') + '</p>';
    h += '<div class="steps">' + rows.map(function (x, i) {
      var before = (x.f || 0) * (x.s || 0), after = (x.f2 || 0) * (x.s2 || 0);
      return '<div class="step rk"><div class="rk-l">' +
        '<div class="step-h"><span class="num">' + (i + 1) + '</span>' +
        '<span class="nm">' + esc(x.step) + '</span></div>' +
        '<div class="rk-g"><div><h3>위험요인</h3><ul>' +
        (x.hazards || []).map(function (y) { return '<li>' + esc(y) + '</li>'; }).join('') +
        '</ul></div><div><h3>예상 피해</h3><ul>' +
        (x.results || []).map(function (y) { return '<li>' + esc(y) + '</li>'; }).join('') +
        '</ul></div><div><h3>조치 사항</h3><ul>' +
        (x.measures || []).map(function (y) { return '<li>' + esc(y) + '</li>'; }).join('') +
        '</ul></div></div></div>' +
        '<div class="rk-r"><div class="score"><b>' + before + '</b>' +
        '<span>조치 전</span><em>' + (x.f || 0) + ' × ' + (x.s || 0) + '</em></div>' +
        '<div class="arrow">↓</div>' +
        '<div class="score ok"><b>' + after + '</b>' +
        '<span>조치 후</span><em>' + (x.f2 || 0) + ' × ' + (x.s2 || 0) + '</em></div>' +
        (x.due ? '<div class="due">기한 ' + esc(x.due) + '</div>' : '') +
        '</div></div>';
    }).join('') + '</div>';
    return h;
  }

  /* 완료보고서 : 현장에서 채우는 화면 */
  function reportView(t) {
    var need = ['작업 전', '작업 중', '작업 후', '정리 상태'];
    return '<p class="lede">작업을 마치면 사진 4종을 올리고 서명을 받습니다. ' +
      '저장하면 PDF 로 내려받을 수 있습니다.</p>' +
      '<h2>현장 사진</h2><div class="shots">' +
      need.map(function (n) {
        return '<label class="drop"><input type="file" accept="image/*" hidden>' +
          '<span class="plus">＋</span><b>' + n + '</b>' +
          '<em>눌러서 촬영 또는 선택</em></label>';
      }).join('') + '</div>' +
      '<h2>확인</h2><div class="sign">' +
      [['작성자', t.ppe ? '시설팀' : ''], ['승인자', '관리소장']].map(function (s) {
        return '<div class="sg"><h3>' + s[0] + '</h3>' +
          '<div class="pad">여기에 서명</div>' +
          '<div class="who">' + esc(s[1]) + '</div></div>';
      }).join('') + '</div>' +
      '<div class="act"><button class="btn">저장하고 PDF 만들기</button></div>';
  }

  function draw() {
    var t = T[cur];
    if (!t) return;
    document.getElementById('title').textContent = t.name || '';
    document.getElementById('crumb').textContent =
      (t.no ? t.no + '. ' : '') + '표준작업';
    document.getElementById('meta').innerHTML =
      (t.place ? '<span><b>장소</b> ' + esc(t.place) + '</span>' : '') +
      (t.docNo ? '<span><b>문서번호</b> ' + esc(t.docNo) + '</span>' : '') +
      '<span><b>보호구</b> ' + (t.ppe || []).length + '종</span>';
    drawTabs();
    view.innerHTML = tab === 'parts' ? partsView(t)
      : tab === 'guide' ? guideView(t)
      : tab === 'risk' ? riskView(t) : reportView(t);
    window.scrollTo(0, 0);
  }

  function go(id) {
    if (!T[id]) return;
    cur = id; tab = 'parts';
    drawTree(document.getElementById('q').value);
    draw();
    document.body.classList.remove('open');
  }

  tree.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-id]');
    if (!a) return;
    e.preventDefault();
    go(a.dataset.id);
  });
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.dataset.tab;
    draw();
  });
  document.getElementById('q').addEventListener('input', function () {
    drawTree(this.value);
  });
  document.getElementById('menu').addEventListener('click', function () {
    document.body.classList.toggle('open');
  });

  go((location.hash || '').slice(1) || 'c02');
})();
</script>
</body>
</html>
