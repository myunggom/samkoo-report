<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안전 표준운영절차</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ────────────────────────────────────────────────────────────────
   색은 무채색 한 계열 + 포인트 1색(삼구 녹색)만 쓴다.
   포인트색은 '지금 어디에 있는지' 와 '반드시 지킬 것' 에만.
   ──────────────────────────────────────────────────────────────── */
:root{
  --bg:#ffffff;           --bg-sub:#fafafa;      --bg-sunk:#f4f4f5;
  --ink:#18181b;          --ink-2:#52525b;       --ink-3:#a1a1aa;
  --line:#e4e4e7;         --line-2:#d4d4d8;
  --accent:#4a9b2f;       --accent-sub:#eef6ea;  --accent-ink:#2f6b1d;
  --warn:#b3261e;         --warn-sub:#fdf0ef;
  --r:10px;
  --sidebar:276px;
  --wide:1680px;
  --tap:44px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#121214;         --bg-sub:#18181b;      --bg-sunk:#1f1f23;
    --ink:#f4f4f5;        --ink-2:#a1a1aa;       --ink-3:#71717a;
    --line:#27272a;       --line-2:#3f3f46;
    --accent:#7cc45f;     --accent-sub:#1c2a16;  --accent-ink:#9fd686;
    --warn:#f2938c;       --warn-sub:#2a1816;
  }
}
:root[data-theme="dark"]{
  --bg:#121214;           --bg-sub:#18181b;      --bg-sunk:#1f1f23;
  --ink:#f4f4f5;          --ink-2:#a1a1aa;       --ink-3:#71717a;
  --line:#27272a;         --line-2:#3f3f46;
  --accent:#7cc45f;       --accent-sub:#1c2a16;  --accent-ink:#9fd686;
  --warn:#f2938c;         --warn-sub:#2a1816;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,
    'Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  font-size:15px; line-height:1.58;
  -webkit-text-size-adjust:100%;
  word-break:keep-all;
}
img{max-width:100%; display:block}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
a{color:inherit}

/* ───────── 뼈대 : 좌측 고정 + 본문 ───────── */
.shell{display:grid; grid-template-columns:var(--sidebar) 1fr; min-height:100dvh}

/* ───────── 좌측 ───────── */
.side{
  position:sticky; top:0; height:100dvh; overflow-y:auto;
  background:var(--bg-sub); border-right:1px solid var(--line);
  display:flex; flex-direction:column;
}
.brand{
  padding:18px 18px 14px; border-bottom:1px solid var(--line);
}
.brand .logo{width:118px; height:auto; margin-bottom:10px}
.brand b{display:block; font-size:14.5px; font-weight:700; letter-spacing:-.01em}
.theme{display:flex; gap:3px; margin-top:11px}
.theme button{
  flex:1; padding:6px 0; border-radius:7px;
  border:1px solid var(--line); background:var(--bg);
  font-size:11.5px; font-weight:600; color:var(--ink-3);
}
.theme button:hover{color:var(--ink-2); border-color:var(--line-2)}
.theme button[aria-pressed="true"]{
  background:var(--accent-sub); border-color:var(--accent);
  color:var(--accent-ink);
}
/* 로고는 밝은 배경용과 어두운 배경용 두 장. 테마에 맞는 것만 보인다 */
.brand .dark{display:none}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    .brand .light{display:none}
    .brand .dark{display:block}
  }
}
:root[data-theme="dark"] .brand .light{display:none}
:root[data-theme="dark"] .brand .dark{display:block}
.find{padding:12px 14px}
.find input{
  width:100%; height:38px; padding:0 12px;
  background:var(--bg); color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r);
  font-size:14px;
}
.find input::placeholder{color:var(--ink-3)}
.find input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}

.tree{flex:1; padding:0 8px 24px}
.grp{margin-bottom:2px}
.grp>summary{
  display:flex; align-items:center; gap:8px; cursor:pointer;
  padding:9px 10px; border-radius:8px; list-style:none;
  font-size:12.5px; font-weight:700; color:var(--ink-2);
  letter-spacing:-.01em; min-height:36px;
}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::marker{content:''}
.grp>summary:hover{background:var(--bg-sunk)}
.grp>summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.grp>summary .caret{
  margin-left:auto; color:var(--ink-3); font-size:11px;
  transition:transform .15s ease;
}
.grp[open]>summary .caret{transform:rotate(90deg)}
.grp .list{padding:2px 0 8px}
.grp .list a{
  display:block; padding:8px 10px 8px 18px; border-radius:8px;
  font-size:13.5px; color:var(--ink-2); text-decoration:none;
  letter-spacing:-.01em;
  border-left:2px solid transparent;
}
.grp .list a:hover{background:var(--bg-sunk); color:var(--ink)}
.grp .list a[aria-current="true"]{
  background:var(--accent-sub); color:var(--accent-ink);
  border-left-color:var(--accent); font-weight:700;
}

/* ───────── 본문 ───────── */
.main{min-width:0; display:flex; flex-direction:column}
.bar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:var(--wide); margin:0 auto; padding:0 32px}
.crumb{
  display:flex; align-items:center; gap:7px;
  padding:14px 0 0; font-size:12px; color:var(--ink-3);
}
h1{
  margin:4px 0 2px; font-size:23px; font-weight:800;
  letter-spacing:-.025em; line-height:1.25;
}
.meta{display:flex; flex-wrap:wrap; gap:14px; padding-bottom:12px;
  font-size:12.5px; color:var(--ink-2)}
.meta b{font-weight:600; color:var(--ink-3)}

.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  position:relative; white-space:nowrap;
  padding:11px 14px; font-size:14px; font-weight:600;
  color:var(--ink-3); border-bottom:2px solid transparent;
  min-height:var(--tap);
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tabs .prt{
  margin-left:auto; align-self:center; padding:6px 13px;
  border:1px solid var(--line-2); border-radius:8px;
  font-size:12.5px; font-weight:600; color:var(--ink-2);
  min-height:34px;
}
.tabs .prt:hover{border-color:var(--accent); color:var(--accent-ink)}

.body{max-width:var(--wide); margin:0 auto; padding:24px 32px 96px; width:100%}
h2{
  margin:32px 0 12px; font-size:15px; font-weight:700;
  letter-spacing:-.015em; color:var(--ink);
}
h2:first-child{margin-top:0}
.lede{margin:0 0 18px; color:var(--ink-2); font-size:13.5px; max-width:66ch}

/* 각부 명칭 : 도면 + 번호 목록 */
.pt{display:grid; gap:24px; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  align-items:start}
.fig{
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--bg-sunk); overflow:hidden; margin:0;
}
.fig .wrap{position:relative; line-height:0}
.fig .wrap.none{
  aspect-ratio:4/3; display:grid; place-items:center; line-height:1.5;
  border-bottom:1px dashed var(--line-2);
}
.fig .wrap.none span{font-size:13px; color:var(--ink-3)}
.fig img{width:100%; height:auto}
.fig figcaption{
  padding:9px 14px; font-size:12.5px; color:var(--ink-2);
  border-top:1px solid var(--line); background:var(--bg-sub); line-height:1.5;
}
/* 도면 위 번호 : 좌표는 자료에 들어 있는 퍼센트 값 */
.mk{
  position:absolute; transform:translate(-50%,-50%);
  width:27px; height:27px; border-radius:50%;
  background:var(--accent); color:#fff;
  display:grid; place-items:center;
  font-size:13px; font-weight:800; font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 2.5px var(--bg), 0 2px 6px rgb(0 0 0 / .3);
  cursor:default;
}
.mk.on{background:var(--ink); transform:translate(-50%,-50%) scale(1.18)}
.parts{margin:0; padding:0; list-style:none; border-top:1px solid var(--line)}
.parts li.on{background:var(--accent-sub)}
.parts li.on .num{background:var(--accent); color:#fff}
.parts li{display:flex; gap:13px; padding:13px 2px; border-bottom:1px solid var(--line)}
.num{
  flex:none; width:25px; height:25px; border-radius:50%;
  background:var(--bg-sunk); color:var(--ink-2);
  display:grid; place-items:center;
  font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;
}
.parts .nm{font-size:14px; font-weight:600; letter-spacing:-.01em}
.parts .ds{font-size:13px; color:var(--ink-2); margin-top:2px}

/* 점검 상자 3칸 */
.notes{display:grid; gap:12px; grid-template-columns:repeat(3,1fr); margin-top:20px}
.note{border:1px solid var(--line); border-radius:var(--r); padding:14px 15px; background:var(--bg-sub)}
.note.ban{border-color:color-mix(in srgb,var(--warn) 35%,var(--line)); background:var(--warn-sub)}
.note h3{margin:0 0 9px; font-size:12.5px; font-weight:700; color:var(--ink-2)}
.note.ban h3{color:var(--warn)}
.note ul{margin:0; padding-left:16px; font-size:13px; color:var(--ink-2)}
.note li+li{margin-top:5px}

/* 교육자료 : 사진 1 + 문장 2~3 */
.steps{display:grid; gap:16px; grid-template-columns:repeat(2,minmax(0,1fr))}
.step{
  display:flex; flex-direction:column; gap:12px;
  border:1px solid var(--line); border-radius:var(--r);
  padding:12px; background:var(--bg-sub);
}
.step.must{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.shot{
  width:100%; aspect-ratio:3/2; object-fit:cover;
  border-radius:7px; border:1px solid var(--line); background:var(--bg-sunk);
  cursor:zoom-in;
}
.shot.none{
  display:grid; place-items:center; cursor:default;
  border-style:dashed; border-color:var(--line-2);
}
.shot.none span{font-size:12px; color:var(--ink-3)}
.step-h{display:flex; align-items:center; gap:9px; margin-bottom:7px; flex-wrap:wrap}
.step-h .nm{font-size:14.5px; font-weight:700; letter-spacing:-.015em}
.tag{
  font-size:11px; font-weight:700; padding:2px 7px; border-radius:5px;
  background:var(--accent-sub); color:var(--accent-ink);
}
.tag.w{background:var(--warn-sub); color:var(--warn)}
.step ul{margin:0; padding-left:16px; font-size:13.5px; color:var(--ink-2)}
.step li+li{margin-top:4px}

/* 보호구 */
.ppe{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px}
.ppe .it{
  flex:0 1 112px; text-align:center; padding:12px 8px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--bg-sub);
}
.ppe img{height:46px; width:auto; margin:0 auto 8px; object-fit:contain}
.ppe span{font-size:12.5px; font-weight:600; white-space:nowrap}

/* 서식 (위험성평가 · 완료보고서) */
.sheet{border:1px solid var(--line); border-radius:var(--r); padding:18px;
  background:var(--bg-sub)}
.sheet-h{margin-bottom:14px}
.sheet-h b{display:block; font-size:16px; font-weight:700; letter-spacing:-.015em}
.sheet-h span{display:block; font-size:12.5px; color:var(--ink-2); margin-top:3px}
.scroll{overflow-x:auto; margin:0 -4px; padding:0 4px}
table{border-collapse:collapse; width:100%; background:var(--bg)}
table.head{margin-bottom:14px; font-size:13px}
table.head th{background:var(--bg-sunk); color:var(--ink-2); font-weight:600;
  text-align:left; white-space:nowrap; padding:8px 10px;
  border:1px solid var(--line); width:1%}
table.head td{padding:6px 10px; border:1px solid var(--line)}
table.head input{width:100%; min-width:80px; border:0; background:none;
  color:var(--ink); font:inherit; font-size:13px; padding:2px 0}
table.head input:focus{outline:2px solid var(--accent); outline-offset:2px;
  border-radius:4px}

table.grid{font-size:12.5px; min-width:1000px}
table.grid th{background:var(--bg-sunk); color:var(--ink-2); font-weight:700;
  padding:7px 8px; border:1px solid var(--line); white-space:nowrap}
table.grid td{padding:7px 8px; border:1px solid var(--line); vertical-align:top}
table.grid td.c{text-align:center; white-space:nowrap}
table.grid td.n{font-variant-numeric:tabular-nums; font-weight:700}
table.grid td.hi{background:var(--warn-sub); color:var(--warn)}
table.grid td.mid{background:var(--bg-sunk)}
table.grid td.low{background:var(--accent-sub); color:var(--accent-ink)}
table.grid.crew{min-width:520px}
table.grid .sg-c{height:38px}
ul.cell{margin:0; padding-left:15px}
ul.cell li+li{margin-top:3px}

table.legend{margin-top:12px; font-size:12.5px; color:var(--ink-2);
  background:none; width:auto}
table.legend td{padding:4px 16px 4px 0; border:0}
.chip{display:inline-block; padding:1px 8px; border-radius:5px;
  font-weight:700; font-variant-numeric:tabular-nums}
.chip.hi{background:var(--warn-sub); color:var(--warn)}
.chip.mid{background:var(--bg-sunk); color:var(--ink-2)}
.chip.low{background:var(--accent-sub); color:var(--accent-ink)}
.fine{margin:12px 0 0; font-size:12px; color:var(--ink-3); line-height:1.65}

ul.checks{margin:0; padding:0; list-style:none}
ul.checks li{display:flex; gap:10px; align-items:center; padding:10px 2px;
  border-bottom:1px solid var(--line); font-size:14px}
ul.checks input{width:18px; height:18px; accent-color:var(--accent); flex:none}

.shots{display:grid; gap:12px; grid-template-columns:repeat(4,1fr)}
.drop{display:grid; place-items:center; gap:3px; cursor:pointer;
  aspect-ratio:4/3; border:1px dashed var(--line-2); border-radius:var(--r);
  background:var(--bg); text-align:center; padding:10px}
.drop:hover{border-color:var(--accent); background:var(--accent-sub)}
.drop .plus{font-size:21px; color:var(--ink-3); line-height:1}
.drop b{font-size:13px; font-weight:600}
.drop em{font-style:normal; font-size:11.5px; color:var(--ink-3)}
.act{margin-top:22px}
.btn{min-height:var(--tap); padding:0 20px; border-radius:var(--r);
  background:var(--accent); color:#fff; font-size:15px; font-weight:700}
.btn:hover{filter:brightness(.94)}
.btn:active{transform:translateY(1px)}

/* 위험성평가 입력칸 */
.grid.rk input.sc{
  width:34px; padding:3px 0; text-align:center;
  border:1px solid var(--line-2); border-radius:5px;
  background:var(--bg); color:var(--ink);
  font:inherit; font-size:12.5px; font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;
}
.grid.rk input.sc::-webkit-outer-spin-button,
.grid.rk input.sc::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.grid.rk input.sc:focus{outline:2px solid var(--accent); outline-offset:1px;
  border-color:transparent}
.grid.rk td.v{font-size:13.5px}
.yn{white-space:nowrap}
.yn button{
  width:25px; height:25px; margin:0 1px; border-radius:6px;
  border:1px solid var(--line-2); background:var(--bg);
  font-size:12px; font-weight:700; color:var(--ink-3);
}
.yn button:hover{border-color:var(--ink-3); color:var(--ink-2)}
.yn button.on{background:var(--accent); border-color:var(--accent); color:#fff}
.yn button[data-y="N"].on{background:var(--warn); border-color:var(--warn)}
.only-print{display:none}

/* 산정 기준 (뒷장) */
.page2{margin-top:20px}
table.grid.mx{min-width:620px}
table.grid.mx th.lbl{text-align:left; white-space:nowrap}
table.grid.lvs{min-width:620px}

/* QR */
.qr-card{
  display:flex; gap:28px; align-items:center;
  border:1px solid var(--line); border-radius:var(--r);
  padding:26px; background:var(--bg);
}
.qr-card canvas{width:260px; height:260px; image-rendering:pixelated; flex:none}
.qr-info{min-width:0}
.qr-no{font-size:12.5px; font-weight:700; color:var(--accent-ink)}
.qr-nm{font-size:24px; font-weight:800; letter-spacing:-.02em; margin:3px 0 7px}
.qr-pl,.qr-dc{font-size:13px; color:var(--ink-2)}
.qr-url{
  margin-top:12px; font-size:11.5px; color:var(--ink-3);
  word-break:break-all; max-width:46ch;
}
.btn.ghost{background:none; color:var(--ink-2); border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--ink-3); filter:none}

/* 사진 비교 · 비용 비교 */
.rep .jump a{color:var(--accent-ink); text-decoration:none;
  border-bottom:1px solid currentColor}
.kpi{display:grid; gap:11px; grid-template-columns:repeat(4,1fr); margin:0 0 24px}
.kpi .k{border:1px solid var(--line); border-radius:9px; padding:14px 15px;
  background:var(--bg-sub)}
.kpi .k b{display:block; font-size:23px; font-weight:800; line-height:1.2;
  letter-spacing:-.025em; font-variant-numeric:tabular-nums}
.kpi .k span{display:block; font-size:12.5px; color:var(--ink-2); margin-top:3px}
.kpi .k em{display:block; font-style:normal; font-size:11.5px;
  color:var(--ink-3); margin-top:5px}
.kpi .k.good b{color:var(--accent-ink)}

.cmp{display:grid; gap:16px; grid-template-columns:repeat(2,minmax(0,1fr))}
.cmp .item{border:1px solid var(--line); border-radius:9px; overflow:hidden;
  background:var(--bg-sub); break-inside:avoid}
.cmp .hd{display:flex; align-items:baseline; gap:8px; padding:10px 13px;
  border-bottom:1px solid var(--line); background:var(--bg)}
.cmp .no{font-size:12px; font-weight:800; color:var(--accent-ink);
  font-variant-numeric:tabular-nums}
.cmp .nm{font-size:14px; font-weight:700; letter-spacing:-.015em}
.cmp .pair{display:grid; grid-template-columns:1fr 1fr; gap:1px;
  background:var(--line)}
.cmp .half{background:var(--bg); position:relative}
.cmp .half img{width:100%; aspect-ratio:3/2; object-fit:cover; display:block}
.cmp .ph{aspect-ratio:3/2; display:grid; place-items:center;
  background:var(--bg-sunk)}
.cmp .ph span{font-size:12px; color:var(--ink-3)}
.cmp .tagp{position:absolute; top:6px; left:6px; padding:2px 7px;
  border-radius:5px; font-size:11px; font-weight:700;
  background:rgb(0 0 0 / .62); color:#fff; z-index:1}
.cmp .half.after .tagp{background:var(--accent)}
.cmp .half.after.wait .tagp{background:var(--ink-3)}
.cmp .fixed{padding:8px 13px; font-size:12.5px; color:var(--ink-2);
  border-top:1px solid var(--line)}
.cmp .fixed b{color:var(--accent-ink)}

.rep table{font-size:13px; margin-bottom:4px}
.rep table th,.rep table td{border:1px solid var(--line); padding:8px 11px;
  text-align:left; vertical-align:top}
.rep table th{background:var(--bg-sunk); color:var(--ink-2); font-weight:700;
  white-space:nowrap}
.rep table td.n,.rep table th.n{text-align:right; white-space:nowrap;
  font-variant-numeric:tabular-nums}
.rep table tr.sum td,.rep table tr.sum th{background:var(--accent-sub);
  color:var(--accent-ink); font-weight:700}

@media (max-width:1100px){
  .kpi{grid-template-columns:repeat(2,1fr)}
  .cmp{grid-template-columns:1fr}
}

/* 체크시트 */
table.grid.cs{min-width:760px}
table.grid.cs td.ck{width:30px; height:26px; background:var(--bg-sunk)}
table.grid.cs tr.sec td{
  background:var(--accent-sub); color:var(--accent-ink);
  font-weight:700; font-size:12px;
}
.ppe .noimg{
  height:46px; margin:0 auto 8px; border-radius:7px;
  border:1px dashed var(--line-2); background:var(--bg-sunk);
}

/* 빈 상태 */
.empty{
  border:1px dashed var(--line-2); border-radius:var(--r);
  padding:44px 24px; text-align:center; color:var(--ink-3);
}
.empty b{display:block; color:var(--ink-2); font-size:15px; margin-bottom:5px}

/* 모바일 */
.mob{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{
    position:fixed; inset:0 auto 0 0; width:84vw; max-width:320px; z-index:50;
    transform:translateX(-100%); transition:transform .2s ease;
    box-shadow:0 0 0 100vmax rgb(0 0 0 / 0);
  }
  body.open .side{transform:none}
  body.open::after{
    content:""; position:fixed; inset:0; z-index:40; background:rgb(0 0 0 / .4);
  }
  .mob{
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30; background:var(--bg);
  }
  .mob button{
    min-height:var(--tap); min-width:var(--tap);
    display:grid; place-items:center; border:1px solid var(--line);
    border-radius:9px;
  }
  .bar-in,.body{padding-left:16px; padding-right:16px}
  h1{font-size:21px}
  .notes{grid-template-columns:1fr}
  .shots{grid-template-columns:repeat(2,1fr)}
  .sheet{padding:14px}
  table.head th,table.head td{display:block; width:auto; border-top:0}
  table.head tr:first-child th:first-child{border-top:1px solid var(--line)}
  .pt{grid-template-columns:1fr; gap:16px}
  .steps{grid-template-columns:1fr}
  .mk{width:23px; height:23px; font-size:11.5px}
}

/* ───────── 인쇄 · PDF : A4 가로 한 쪽 ───────── */
@page{size:A4 landscape; margin:8mm}
@media print{
  :root{
    --bg:#fff; --bg-sub:#fff; --bg-sunk:#f3f4f6;
    --ink:#000; --ink-2:#333; --ink-3:#666;
    --line:#bbb; --line-2:#999;
    --accent:#2f6b1d; --accent-sub:#eaf3e6; --accent-ink:#2f6b1d;
    --warn:#9b1c15; --warn-sub:#fbeceb;
  }
  html,body{background:#fff !important; font-size:9pt; line-height:1.4}
  .side,.mob,.tabs,.crumb,.noprint,.act,.find{display:none !important}
  .shell{display:block}
  .bar{position:static; border:0; backdrop-filter:none}
  .bar-in,.body{max-width:none; padding:0; margin:0}
  .body{padding-bottom:0}
  .main{display:block}

  h1{font-size:15pt; margin:0 0 1mm}
  .meta{font-size:8pt; gap:8px; padding-bottom:2mm;
    border-bottom:1px solid var(--line); margin-bottom:3mm}
  h2{font-size:9.5pt; margin:3mm 0 1.5mm}
  .lede{font-size:8pt; margin-bottom:2mm}
  .fine{font-size:7pt; margin-top:2mm}

  /* 한 쪽에 들어가도록 */
  .sheet{border:0; padding:0; background:none}
  .sheet-h b{font-size:12pt}
  .sheet-h span{font-size:8pt}
  .scroll{overflow:visible !important; margin:0; padding:0}
  table.grid{min-width:0 !important; width:100%; font-size:7pt}
  table.grid th,table.grid td{padding:1.2mm 1.4mm}
  table.head{font-size:8pt}
  table.head th,table.head td{padding:1.2mm 2mm}
  ul.cell{padding-left:3mm}

  /* 사진 비교 · 비용 비교 */
  .kpi{gap:2.5mm; margin-bottom:4mm}
  .kpi .k{padding:2mm 2.5mm}
  .kpi .k b{font-size:13pt}
  .kpi .k span{font-size:7.5pt}
  .kpi .k em{font-size:6.5pt}
  .cmp{gap:2.5mm}
  .cmp .item{break-inside:avoid}
  .cmp .nm{font-size:8.5pt}
  .cmp .fixed{font-size:7pt; padding:1.2mm 2mm}
  .rep .jump{display:none}
  .rep table{font-size:7.5pt}
  .rep table th,.rep table td{padding:1.2mm 1.8mm}
  .pagebreak{break-before:page}

  /* 입력칸은 적힌 값만 */
  input,textarea,select{display:none !important}
  .only-print{display:inline !important; font-weight:700}
  .yn button{display:none !important}
  table.head td:has(input){border-bottom:1px solid var(--line)}

  /* 각부 명칭 : 도면 + 목록 한 쪽 */
  .pt{grid-template-columns:1fr 1fr; gap:5mm}
  .fig img{max-height:118mm; width:auto; margin:0 auto}
  .fig figcaption{font-size:7.5pt; padding:1.5mm 2mm}
  .mk{width:6mm; height:6mm; font-size:8pt; box-shadow:0 0 0 .6mm #fff}
  .parts li{padding:1.6mm 0}
  .parts .nm{font-size:8.5pt}
  .parts .ds{font-size:7.5pt}
  .num{width:5mm; height:5mm; font-size:7.5pt}
  .notes{gap:3mm; margin-top:3mm}
  .note{padding:2mm 2.5mm}
  .note h3{font-size:7.5pt; margin-bottom:1mm}
  .note ul{font-size:7pt; padding-left:3.5mm}

  /* 교육자료 : 12칸을 한 쪽에 (4 x 3) */
  .steps{grid-template-columns:repeat(4,1fr); gap:2.5mm}
  .step{padding:1.5mm; gap:1.5mm; break-inside:avoid}
  .shot{aspect-ratio:3/2; border-radius:1mm}
  .step-h{gap:1.5mm; margin-bottom:1mm}
  .step-h .nm{font-size:8pt}
  .tag{font-size:6pt; padding:0 1mm}
  .step ul{font-size:7pt; padding-left:3.5mm}
  .step li+li{margin-top:.5mm}

  /* 보호구 */
  .ppe{gap:2mm}
  .ppe .it{flex:0 1 20mm; padding:1.5mm}
  .ppe img{height:9mm; margin-bottom:1mm}
  .ppe span{font-size:7pt}

  /* 완료보고서 */
  .shots{gap:3mm}
  .drop{aspect-ratio:4/3; border:1px solid var(--line)}
  .drop .plus{font-size:11pt}
  .drop b{font-size:7.5pt}
  .drop em{font-size:6.5pt}
  ul.checks li{padding:1.4mm 0; font-size:8pt}
  ul.checks input{display:inline-block !important; width:3.2mm; height:3.2mm}
  table.grid .sg-c{height:9mm}

  /* 산정 기준은 뒷장으로 */
  .page2{break-before:page; margin-top:0}

  /* QR : 가운데 크게 */
  .qr-card{border:1px solid var(--line); padding:10mm; gap:12mm;
    justify-content:center}
  .qr-card canvas{width:78mm; height:78mm}
  .qr-nm{font-size:20pt}
  .qr-url{font-size:8pt}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>

<div class="mob">
  <button id="menu" aria-label="작업 목록 열기">☰</button>
  <b style="font-size:14px">안전 표준운영절차</b>
</div>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <img class="logo light" src="assets/samkoo.png" alt="Samkoo">
      <img class="logo dark" src="assets/samkoo_dark.png" alt="Samkoo">
      <b>안전 표준운영절차</b>
      <div class="theme" role="group" aria-label="화면 모드">
        <button data-t="light" title="밝게">밝게</button>
        <button data-t="dark" title="어둡게">어둡게</button>
        <button data-t="auto" title="기기 설정 따름">자동</button>
      </div>
    </div>
    <div class="find">
      <input id="q" type="search" placeholder="작업 찾기" autocomplete="off">
    </div>
    <nav class="tree" id="tree"></nav>
  </aside>

  <main class="main">
    <div class="bar">
      <div class="bar-in">
        <div class="crumb" id="crumb"></div>
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
        <div class="tabs" id="tabs" role="tablist"></div>
      </div>
    </div>
    <div class="body" id="view"></div>
  </main>
</div>

<script src="assets/qr.js"></script>
<script src="assets/data.js"></script>
<script src="assets/checks.js"></script>
<script src="assets/report.js"></script>
<script>
(function () {
  var IMG = 'assets/img/';
  var T = window.TASKS || {}, S = window.SITE || {};
  var CH = window.CHECKS || {};
  var tree = document.getElementById('tree');
  var view = document.getElementById('view');
  var tabs = document.getElementById('tabs');
  var cur = null, tab = 'parts';
  var 열린묶음 = {};        /* 펼쳐 둔 묶음을 기억해 다시 그려도 유지한다 */

  var TABS = [
    ['parts', '각부 명칭'],
    ['guide', '안전작업 지침'],
    ['risk', '위험성평가'],
    ['report', '완료보고서'],
    ['qr', 'QR 코드']
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function img(n) { return n ? IMG + n : ''; }

  /* ── 좌측 목록 ── */
  function drawTree(filter) {
    var f = (filter || '').trim();
    tree.innerHTML = '';
    (S.groups || []).forEach(function (g, gi) {
      var ids = [];
      (g.chapters || []).forEach(function (c) {
        (c.tasks || []).forEach(function (id) { if (T[id]) ids.push(id); });
      });
      if (f) {
        ids = ids.filter(function (id) {
          return (T[id].name || '').indexOf(f) >= 0;
        });
      }
      if (!ids.length) return;
      tree.appendChild(그룹상자(g.title, ids.map(function (id) {
        return [id, T[id].name];
      }), f || gi === 1));
    });

    /* 안전 체크시트 */
    (window.CHECKGROUPS || []).forEach(function (g) {
      var ids = Object.keys(CH).filter(function (k) {
        return CH[k].group === g.name &&
          (!f || CH[k].name.indexOf(f) >= 0 || k.indexOf(f) >= 0);
      }).sort(순번);
      if (!ids.length) return;
      tree.appendChild(그룹상자(g.title, ids.map(function (k) {
        return [k, CH[k].name];
      }), !!f));
    });
  }

  function 순번(a, b) {
    var x = a.split('-'), y = b.split('-');
    return (+x[0] - +y[0]) || (+x[1] - +y[1]);
  }

  function 그룹상자(title, pairs, open) {
    var d = document.createElement('details');
    d.className = 'grp';
    var 지금것 = pairs.some(function (p) { return p[0] === cur; });
    if (open || 지금것 || 열린묶음[title]) d.open = true;
    d.dataset.g = title;
    d.addEventListener('toggle', function () {
      열린묶음[title] = d.open;
    });
    var list = pairs.map(function (p) {
      return '<a href="#' + p[0] + '" data-id="' + p[0] + '"' +
        (p[0] === cur ? ' aria-current="true"' : '') + '>' +
        esc(p[1]) + '</a>';
    }).join('');
    d.innerHTML = '<summary>' + esc(title) +
      '<span class="caret">&#9656;</span></summary>' +
      '<div class="list">' + list + '</div>';
    return d;
  }

  /* ── 탭 ── */
  function drawTabs() {
    var 목록 = TABS.concat(
      (window.REPORT && REPORT.has(cur))
        ? [['compare', '사진 비교'], ['cost', '비용 비교']] : []);
    tabs.innerHTML = 목록.map(function (t) {
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' +
        (t[0] === tab) + '">' + t[1] + '</button>';
    }).join('') +
      '<button class="prt noprint" id="btnPrint">인쇄 · PDF</button>';
    document.getElementById('btnPrint')
      .addEventListener('click', function () { window.print(); });
  }

  /* ── 본문 ── */
  function partsView(t) {
    var p = t.parts || {}, h = '', fig = '', list = '';
    if (!p.figure && (p.items || []).length) {
      fig = '<figure class="fig"><div class="wrap none">' +
        '<span>장비 도면 준비 중</span></div>' + (p.figureCaption ?
          '<figcaption>' + esc(p.figureCaption) + '</figcaption>' : '') +
        '</figure>';
    }
    if (p.figure) {
      var marks = (p.marks || []).map(function (m) {
        return '<span class="mk" data-n="' + m.n + '" style="left:' +
          m.x + '%;top:' + m.y + '%">' + m.n + '</span>';
      }).join('');
      fig = '<figure class="fig"><div class="wrap"><img src="' + img(p.figure) +
        '" alt="">' + marks + '</div>' + (p.figureCaption ?
          '<figcaption>' + esc(p.figureCaption) + '</figcaption>' : '') +
        '</figure>';
    }
    if ((p.items || []).length) {
      list = '<ul class="parts">' + p.items.map(function (it) {
        return '<li data-n="' + it.n + '"><span class="num">' + esc(it.n) +
          '</span><div>' +
          '<div class="nm">' + esc(it.name) + '</div>' +
          (it.desc ? '<div class="ds">' + esc(it.desc) + '</div>' : '') +
          '</div></li>';
      }).join('') + '</ul>';
    }
    if (fig && list) h += '<div class="pt">' + fig + '<div>' + list + '</div></div>';
    else h += fig + list;
    var box = [['pre', '작업 전 점검', ''], ['use', '사용 기준', ''],
               ['ban', '금지 사항', 'ban']];
    var got = box.filter(function (b) { return (p[b[0]] || []).length; });
    if (got.length) {
      h += '<div class="notes">' + got.map(function (b) {
        return '<div class="note ' + b[2] + '"><h3>' + b[1] + '</h3><ul>' +
          p[b[0]].map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
          '</ul></div>';
      }).join('') + '</div>';
    }
    h += '<h2>작업별 필수 개인보호구</h2><div class="ppe">' +
      (t.ppe || []).map(function (q) {
        return '<div class="it"><img src="' + img(q.img) + '" alt="">' +
          '<span>' + esc(q.name) + '</span></div>';
      }).join('') + '</div>';
    return h || empty('각부 명칭 자료가 아직 없습니다.');
  }

  function shot(name) {
    return name
      ? '<img class="shot" src="' + img(name) + '" alt="" loading="lazy">'
      : '<div class="shot none"><span>사진 준비 중</span></div>';
  }

  function guideView(t) {
    var secs = t.guide || [];
    if (!secs.length) return empty('교육자료가 아직 없습니다.');
    return secs.map(function (s) {
      return '<h2>' + esc(s.title) + '</h2><div class="steps">' +
        (s.items || []).map(function (it) {
          return '<div class="step' + (it.must ? ' must' : '') + '">' +
            shot(it.img) +
            '<div><div class="step-h"><span class="num">' + esc(it.n) +
            '</span><span class="nm">' + esc(it.name) + '</span>' +
            (it.must ? '<span class="tag">필수</span>' : '') +
            (it.warn ? '<span class="tag w">' + esc(it.warn) + '</span>' : '') +
            '</div><ul>' +
            (it.bullets || []).map(function (b) {
              return '<li>' + esc(b) + '</li>';
            }).join('') + '</ul></div></div>';
        }).join('') + '</div>';
    }).join('');
  }

  function empty(msg) {
    return '<div class="empty"><b>' + esc(msg) + '</b>' +
      '이 작업에는 아직 자료가 없습니다.</div>';
  }

  /* 위험성평가 : 기존 risk.html 과 같은 표 구성 */
  function li(a) {
    return '<ul class="cell">' + (a || []).map(function (x) {
      return '<li>' + esc(x) + '</li>';
    }).join('') + '</ul>';
  }
  function lv(n) { return n >= 15 ? 'hi' : n >= 8 ? 'mid' : n > 0 ? 'low' : ''; }

  function riskView(t) {
    var r = t.risk || {}, rows = r.rows || [];
    if (!rows.length) return empty('위험성평가표');
    var h = '<div class="sheet" id="sheetRisk"><div class="sheet-h"><b>위험성평가표</b>' +
      '<span>빈도와 강도는 기본값이 들어 있습니다. 칸을 눌러 바꾸면 위험도가 다시 계산됩니다.</span></div>';

    h += '<table class="head"><tr>' +
      '<th>공정 / 작업명</th><td>' + esc(t.name) + '</td>' +
      '<th>평가대상</th><td>' + esc(r.target || '') + '</td>' +
      '<th>평가일자</th><td><input placeholder="2026.00.00"></td>' +
      '<th>평가자</th><td><input placeholder="성명"></td></tr></table>';

    h += '<div class="scroll"><table class="grid rk"><thead>' +
      '<tr><th rowspan="2">NO</th><th rowspan="2">작업단계</th>' +
      '<th rowspan="2">유해 · 위험요인</th><th rowspan="2">위험 발생 상황 및 결과</th>' +
      '<th colspan="3">현재 위험도</th>' +
      '<th rowspan="2">위험성 감소대책 (개선 조치사항)</th>' +
      '<th rowspan="2">조치<br>기한</th><th rowspan="2">담당자</th>' +
      '<th rowspan="2">조치<br>여부</th><th colspan="3">개선 후 위험도</th></tr>' +
      '<tr><th>빈도</th><th>강도</th><th>위험도</th>' +
      '<th>빈도</th><th>강도</th><th>위험도</th></tr></thead><tbody>';

    rows.forEach(function (x, i) {
      h += '<tr data-i="' + i + '"><td class="c">' + (i + 1) + '</td>' +
        '<td>' + esc(x.step) + '</td>' +
        '<td>' + li(x.hazards) + '</td>' +
        '<td>' + li(x.results) + '</td>' +
        num(i, 'f', x.f) + num(i, 's', x.s) +
        '<td class="c n v" data-v="1"></td>' +
        '<td>' + li(x.measures) + '</td>' +
        '<td class="c">' + esc(x.due || '') + '</td>' +
        '<td class="c">' + esc(x.owner || '') + '</td>' +
        '<td class="c yn"><button type="button" data-y="Y">Y</button>' +
        '<button type="button" data-y="N">N</button>' +
        '<span class="only-print"></span></td>' +
        num(i, 'f2', x.f2) + num(i, 's2', x.s2) +
        '<td class="c n v" data-v="2"></td></tr>';
    });
    h += '</tbody></table></div>';

    h += '<table class="legend"><tr>' +
      [['15 ~ 25', '고위험', 'hi'], ['8 ~ 14', '중위험', 'mid'],
       ['1 ~ 7', '저위험', 'low']].map(function (g) {
        return '<td><span class="chip ' + g[2] + '">' + g[0] + '</span> ' +
          g[1] + '</td>';
      }).join('') + '</tr></table>' +
      '<p class="fine">※ 위험도 = 빈도 × 강도　　' +
      '※ 평가일자 · 평가자 · 조치여부는 실제 평가 시행 시 기입　　' +
      '※ 산정 기준은 뒷장 참조</p></div>';

    h += criteriaView();
    return h;
  }

  function num(i, k, v) {
    return '<td class="c n"><input class="sc" type="number" min="1" max="5" ' +
      'data-i="' + i + '" data-k="' + k + '" value="' + (v || '') + '">' +
      '<span class="only-print">' + (v || '') + '</span></td>';
  }

  /* 뒷장 : 산정 기준 (인쇄하면 별쪽) */
  function criteriaView() {
    var FQ = ['1 ( 매우 낮음 )', '2 ( 낮음 )', '3 ( 보통 )',
              '4 ( 높음 )', '5 ( 매우 높음 )'];
    var SV = { 5: '5 ( 치명적 / 사망 )', 4: '4 ( 중상 / 장해 )',
               3: '3 ( 경상 / 휴업 )', 2: '2 ( 경미 / 비휴업 )',
               1: '1 ( 극히 경미 )' };
    var h = '<div class="sheet page2"><div class="sheet-h">' +
      '<b>위험도 산정 및 평가 기준</b>' +
      '<span>위험도 = 빈도(가능성) × 강도(중대성),  5 × 5 기준표</span></div>';

    h += '<div class="scroll"><table class="grid mx"><thead><tr><th>강도 \\ 빈도</th>' +
      FQ.map(function (x) { return '<th>' + x + '</th>'; }).join('') +
      '</tr></thead><tbody>';
    [5, 4, 3, 2, 1].forEach(function (sv) {
      h += '<tr><th class="lbl">' + SV[sv] + '</th>';
      [1, 2, 3, 4, 5].forEach(function (f) {
        var v = f * sv;
        h += '<td class="c n ' + lv(v) + '">' + v + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';

    h += '<h2>위험성 수준별 조치 기준</h2><div class="scroll">' +
      '<table class="grid lvs"><thead><tr><th>위험도</th><th>수준</th>' +
      '<th>조치 기준</th></tr></thead><tbody>' +
      [['15 ~ 25', '고위험 (High)',
        '즉시 작업을 중단한다. 개선 대책을 세우고 위험요인을 없앤 뒤에 다시 시작한다.', 'hi'],
       ['8 ~ 14', '중위험 (Medium)',
        '정해진 기한 안에 개선 대책을 시행한다. 그동안 안전수칙 준수를 철저히 관리한다.', 'mid'],
       ['1 ~ 7', '저위험 (Low)',
        '지금의 안전 상태를 유지한다. 작업자 교육과 점검을 계속한다.', 'low']
      ].map(function (x) {
        return '<tr><td class="c"><span class="chip ' + x[3] + '">' + x[0] +
          '</span></td><td class="c">' + x[1] + '</td><td>' + x[2] + '</td></tr>';
      }).join('') + '</tbody></table></div>';

    h += '<p class="fine">※ 빈도는 그 일이 얼마나 자주 일어날 수 있는지, ' +
      '강도는 일어났을 때 얼마나 크게 다치는지를 뜻합니다.<br>' +
      '※ 개선 후 위험도가 7 이하가 되도록 대책을 세우는 것을 목표로 합니다.</p></div>';
    return h;
  }

  /* 입력칸 동작 : 숫자 바꾸면 위험도 다시 계산, 조치여부는 Y/N */
  function bindRisk() {
    var tb = view.querySelector('table.rk tbody');
    if (!tb) return;
    function paint(tr) {
      [1, 2].forEach(function (g) {
        var f = tr.querySelector('input[data-k="' + (g === 1 ? 'f' : 'f2') + '"]');
        var sv = tr.querySelector('input[data-k="' + (g === 1 ? 's' : 's2') + '"]');
        var cell = tr.querySelector('td.v[data-v="' + g + '"]');
        var a = parseInt(f && f.value, 10) || 0, b = parseInt(sv && sv.value, 10) || 0;
        var v = a * b;
        cell.textContent = v || '';
        cell.className = 'c n v ' + lv(v);
      });
    }
    [].forEach.call(tb.querySelectorAll('tr'), paint);
    tb.addEventListener('input', function (e) {
      var inp = e.target.closest('input.sc');
      if (!inp) return;
      var n = parseInt(inp.value, 10);
      if (n > 5) inp.value = 5;
      if (n < 1) inp.value = 1;
      inp.nextElementSibling.textContent = inp.value;
      paint(inp.closest('tr'));
    });
    tb.addEventListener('click', function (e) {
      var b = e.target.closest('.yn button');
      if (!b) return;
      var box = b.parentNode, on = b.classList.contains('on');
      [].forEach.call(box.querySelectorAll('button'), function (x) {
        x.classList.remove('on');
      });
      if (!on) b.classList.add('on');
      box.querySelector('.only-print').textContent = on ? '' : b.dataset.y;
    });
  }

  /* QR : 현장에서 찍으면 이 작업으로 바로 들어온다 */
  function qrView(t) {
    return '<div class="sheet qr-sheet"><div class="sheet-h">' +
      '<b>현장 부착용 QR 코드</b>' +
      '<span>장비나 작업 구역에 붙이면, 찍는 즉시 이 작업의 절차서가 열립니다.</span>' +
      '</div><div class="qr-card">' +
      '<canvas id="qrc" width="520" height="520"></canvas>' +
      '<div class="qr-info">' +
      '<div class="qr-no">' + esc(t.no || '') + '</div>' +
      '<div class="qr-nm">' + esc(t.name) + '</div>' +
      (t.place ? '<div class="qr-pl">' + esc(t.place) + '</div>' : '') +
      (t.docNo ? '<div class="qr-dc">' + esc(t.docNo) + '</div>' : '') +
      '<div class="qr-url" id="qrUrl"></div>' +
      '</div></div>' +
      '<div class="act noprint">' +
      '<button class="btn" id="qrPrint">인쇄하기</button> ' +
      '<button class="btn ghost" id="qrSave">그림으로 저장</button></div>' +
      '<p class="fine">※ A4 가로 한 장에 맞춰 인쇄됩니다. ' +
      '코팅해서 붙이면 현장에서 오래 갑니다.</p></div>';
  }

  function bindQr(t) {
    var cv = document.getElementById('qrc');
    if (!cv || !window.QRLite) return;
    var url = location.origin + location.pathname + '#' + t.id;
    document.getElementById('qrUrl').textContent = url;
    QRLite.toCanvas(cv, url, { size: 520, ec: 'M', quiet: 2 });
    var p = document.getElementById('qrPrint');
    if (p) p.addEventListener('click', function () { window.print(); });
    var sv = document.getElementById('qrSave');
    if (sv) sv.addEventListener('click', function () {
      var a = document.createElement('a');
      a.download = 'QR_' + t.id + '.png';
      a.href = cv.toDataURL('image/png');
      a.click();
    });
  }

  /* 완료보고서 : 기존 report.html 과 같은 서식 */
  var RP = {
    title: '사전작업 허가 · 위험성평가 교육 확인 서명부',
    subtitle: '표준작업 1건 · 1일 단위로 1장 작성  ｜  교육 · 점검 · 작업 · 정리 사진 4종 필수 첨부',
    fields: ['작업명', '작업일시', '작업장소', '작업책임자', '작업인원 · 명단', '현장명'],
    slots: [
      ['교육 사진', '작업 전 안전교육 ( TBM ) 실시 장면'],
      ['안전장구류 점검 사진', '개인보호구 · 장비 점검 상태'],
      ['작업 사진', '실제 작업 수행 장면'],
      ['종료 후 정리 사진', '작업장 정리 · 원상복구 상태']
    ],
    checkTitle: '교육 및 평가 실시 내용',
    checks: [
      '안전작업허가(사전작업 허가) 내용 고지',
      '유해 · 위험요인 및 위험성평가 결과 전파',
      '안전작업수칙 및 비상조치 계획 교육',
      '개인보호구 지급 · 착용상태 확인',
      '작업 전 안전점검회의(TBM) 실시'
    ],
    crewTitle: '작업 참여자 확인 서명부',
    crewHead: ['연번', '소속', '성명', '확인 서명'],
    crewRows: 5,
    signTitle: '확  인',
    signHead: ['구분', '성명', '확인 서명'],
    signs: ['작성자', '승인자'],
    pledge: '본인은 위 작업과 관련하여 안전작업허가 내용 및 위험성평가 결과에 대한 설명을 듣고 충분히 이해하였으며, 안전수칙을 준수할 것을 서약합니다. 또한 급박한 위험을 인지한 경우 즉시 작업을 중지하고 대피한 후 보고할 수 있음(작업중지권)을 고지받았습니다.',
    legal: '※ 법적 근거 : 「중대재해처벌법」 제4조 · 시행령 제4조제3호 · 제7호 · 제8호 · 제9호 ｜ 「산업안전보건법」 제16조 · 제29조 · 제36조 · 제52조　　※ 위험성평가표 · 작업 완료보고서와 함께 1건 1세트로 편철하여 3년간 보존'
  };

  function reportView(t) {
    var R = RP, v = [t.name, '', t.place || '', '', '', ''];
    var h = '<div class="sheet"><div class="sheet-h"><b>' + esc(R.title) +
      '</b><span>' + esc(R.subtitle) + '</span></div>';

    h += '<table class="head">';
    for (var i = 0; i < 6; i += 3) {
      h += '<tr>';
      for (var j = i; j < i + 3; j++) {
        h += '<th>' + esc(R.fields[j]) + '</th><td>' +
          (v[j] ? esc(v[j]) : '<input>') + '</td>';
      }
      h += '</tr>';
    }
    h += '</table>';

    h += '<h2>현장 사진 4종</h2><div class="shots">' +
      R.slots.map(function (sl, i) {
        return '<label class="drop"><input type="file" accept="image/*" hidden>' +
          '<span class="plus">＋</span><b>' + (i + 1) + '. ' + esc(sl[0]) +
          '</b><em>' + esc(sl[1]) + '</em></label>';
      }).join('') + '</div>';

    h += '<h2>' + esc(R.checkTitle) + '</h2><ul class="checks">' +
      R.checks.map(function (c) {
        return '<li><input type="checkbox"><span>' + esc(c) + '</span></li>';
      }).join('') + '</ul>';

    h += '<h2>' + esc(R.crewTitle) + '</h2><div class="scroll">' +
      '<table class="grid crew"><thead><tr>' +
      R.crewHead.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') +
      '</tr></thead><tbody>';
    for (var k = 1; k <= R.crewRows; k++) {
      h += '<tr><td class="c">' + k + '</td><td></td><td></td>' +
        '<td class="sg-c"></td></tr>';
    }
    h += '</tbody></table></div>';
    h += '<p class="fine">' + esc(R.pledge) + '</p>';

    h += '<h2>' + esc(R.signTitle) + '</h2><div class="scroll">' +
      '<table class="grid"><thead><tr>' +
      R.signHead.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      R.signs.map(function (n) {
        return '<tr><td class="c">' + esc(n) + '</td><td></td>' +
          '<td class="sg-c"></td></tr>';
      }).join('') + '</tbody></table></div>';

    h += '<p class="fine">' + esc(R.legal) + '</p>' +
      '<div class="act"><button class="btn">저장하고 PDF 만들기</button></div>' +
      '</div>';
    return h;
  }

  /* 체크시트 : 엑셀 양식 그대로, 확인란은 양호/보통/보완 */
  function checkView(c) {
    var h = '<div class="sheet"><div class="sheet-h"><b>' + esc(c.title) +
      '</b><span>확인란 : 양호 O · 보통 △ · 보완 X</span></div>';

    h += '<table class="head">';
    var 칸 = (c.head || []).concat(
      [['일시', ''], ['장소', ''], ['조직(부서)', ''],
       ['현장작업자', ''], ['관리감독자', ''], ['내용', '']]);
    var 본 = [], 쓴 = {};
    칸.forEach(function (x) {
      var k = x[0].replace(/\s/g, '');
      if (!쓴[k]) { 쓴[k] = 1; 본.push(x); }
    });
    본 = 본.slice(0, 6);
    for (var i = 0; i < 본.length; i += 3) {
      h += '<tr>';
      for (var j = i; j < Math.min(i + 3, 본.length); j++) {
        h += '<th>' + esc(본[j][0]) + '</th><td><input value="' +
          esc(본[j][1] || '') + '"></td>';
      }
      h += '</tr>';
    }
    h += '</table>';

    h += '<div class="scroll"><table class="grid cs"><thead><tr>' +
      '<th>NO</th><th>사전조치 및 확인사항</th>' +
      '<th>전</th><th>중</th><th>후</th><th>특기사항</th>' +
      '</tr></thead><tbody>';
    (c.items || []).forEach(function (it) {
      if (it.sec) {
        h += '<tr class="sec"><td colspan="6">' + esc(it.sec) + '</td></tr>';
      }
      h += '<tr><td class="c">' + it.n + '</td><td>' + esc(it.text) + '</td>' +
        '<td class="c ck"></td><td class="c ck"></td><td class="c ck"></td>' +
        '<td></td></tr>';
    });
    h += '</tbody></table></div>';

    if ((c.common || []).length) {
      h += '<h2>공통사항</h2><ul class="checks">' +
        c.common.map(function (x) {
          return '<li><input type="checkbox"><span>' + esc(x) + '</span></li>';
        }).join('') + '</ul>';
    }

    if ((c.ppe || []).length) {
      h += '<h2>이 작업에 필요한 개인보호구</h2><div class="ppe">' +
        c.ppe.map(function (n) {
          var im = PPEIMG[n] || PPEALT[n] || '';
          return '<div class="it">' +
            (im ? '<img src="' + img(im) + '" alt="">'
                : '<div class="noimg"></div>') +
            '<span>' + esc(n) + '</span></div>';
        }).join('') + '</div>' +
        '<p class="fine">※ 작업 내용에서 위험요인을 찾아 자동으로 뽑은 목록입니다. ' +
        '현장 상황에 따라 더하거나 뺄 수 있습니다.</p>';
    }

    if (c.etc) h += '<h2>기타사항</h2><p class="lede">' + esc(c.etc) + '</p>';
    return h + '</div>';
  }

  /* 그림이 따로 없는 보호구는 가장 가까운 것을 빌려 쓴다 */
  var PPEALT = { '공기호흡기': 'ppe_2b723433e8.png' };

  /* 보호구 이름 → 그림. 작업 자료에 쓰인 것을 그대로 빌린다 */
  var PPEIMG = (function () {
    var m = {};
    for (var k in T) {
      (T[k].ppe || []).forEach(function (q) {
        if (q.img && !m[q.name]) m[q.name] = q.img;
      });
    }
    return m;
  })();

  /* 사진 비교 : 왼쪽 기존 · 오른쪽 개선 */
  function compareView(tid) {
    if (!window.REPORT || !REPORT.has(tid)) {
      return empty('이 작업은 아직 사진을 다시 만들지 않았습니다.');
    }
    var 다른 = REPORT.ids().filter(function (x) { return x !== tid; });
    return '<div class="rep">' +
      REPORT.요약칸(tid) +
      '<p class="lede">' + REPORT.요약글(tid) + '</p>' +
      (다른.length
        ? '<p class="lede jump">다른 작업 비교 : ' + 다른.map(function (x) {
            return '<a href="#' + x + '" data-jump="' + x + '">' +
              REPORT.이름(x) + '</a>';
          }).join(' · ') + '</p>' : '') +
      '<h2>열두 장면 — 왼쪽이 기존, 오른쪽이 개선</h2>' +
      '<div class="cmp">' + REPORT.사진격자(tid) + '</div></div>';
  }

  /* 비용 비교 */
  function costView() {
    if (!window.REPORT) return empty('비용 자료를 불러오지 못했습니다.');
    return '<div class="rep">' +
      '<p class="lede">사진을 만드는 데 실제로 들어간 돈과, 사람이 찍어 ' +
      '추려내던 방식과의 차이입니다. 인건비는 가정값임을 표 아래에 밝혔습니다.</p>' +
      REPORT.비용표() + '</div>';
  }

  function draw() {
    if (CH[cur]) return drawCheck(CH[cur]);
    var t = T[cur];
    if (!t) return;
    document.getElementById('title').textContent = t.name || '';
    document.getElementById('crumb').textContent =
      (t.no ? t.no + '. ' : '') + '표준작업';
    document.getElementById('meta').innerHTML =
      (t.place ? '<span><b>장소</b> ' + esc(t.place) + '</span>' : '') +
      (t.docNo ? '<span><b>문서번호</b> ' + esc(t.docNo) + '</span>' : '') +
      '<span><b>보호구</b> ' + (t.ppe || []).length + '종</span>';
    drawTabs();
    view.innerHTML = tab === 'parts' ? partsView(t)
      : tab === 'guide' ? guideView(t)
      : tab === 'risk' ? riskView(t)
      : tab === 'qr' ? qrView(t)
      : tab === 'compare' ? compareView(cur)
      : tab === 'cost' ? costView() : reportView(t);
    window.scrollTo(0, 0);
    link();
    bindRisk();
    bindQr(t);
  }

  /* 도면의 번호와 아래 목록을 짚으면 짝이 같이 밝아진다 */
  function link() {
    var mks = view.querySelectorAll('.mk');
    var lis = view.querySelectorAll('.parts li[data-n]');
    if (!mks.length || !lis.length) return;
    function set(n, on) {
      [].forEach.call(mks, function (m) {
        if (m.dataset.n === n) m.classList.toggle('on', on);
      });
      [].forEach.call(lis, function (l) {
        if (l.dataset.n === n) l.classList.toggle('on', on);
      });
    }
    function bind(els) {
      [].forEach.call(els, function (e) {
        var n = e.dataset.n;
        e.addEventListener('mouseenter', function () { set(n, true); });
        e.addEventListener('mouseleave', function () { set(n, false); });
      });
    }
    bind(mks); bind(lis);
  }

  function drawCheck(c) {
    document.getElementById('title').textContent = c.name;
    document.getElementById('crumb').textContent = c.no + '. 안전 체크시트';
    document.getElementById('meta').innerHTML =
      '<span><b>구분</b> ' + esc(c.group) + '</span>' +
      '<span><b>확인항목</b> ' + (c.items || []).length + '개</span>' +
      ((c.ppe || []).length
        ? '<span><b>보호구</b> ' + c.ppe.length + '종</span>' : '');
    tabs.innerHTML =
      '<button role="tab" aria-selected="true">체크시트</button>' +
      '<button class="prt noprint" id="btnPrint">인쇄 · PDF</button>';
    document.getElementById('btnPrint')
      .addEventListener('click', function () { window.print(); });
    view.innerHTML = checkView(c);
    window.scrollTo(0, 0);
  }

  function go(id, 탭) {
    if (!T[id] && !CH[id]) return;
    cur = id; tab = 탭 || 'parts';
    drawTree(document.getElementById('q').value);
    draw();
    document.body.classList.remove('open');
    주소쓰기();
    var 지금 = tree.querySelector('a[aria-current="true"]');
    if (지금 && 지금.scrollIntoView) {
      지금.scrollIntoView({ block: 'nearest' });
    }
  }

  /* 주소는 #작업id 또는 #작업id/탭 */
  function 주소쓰기() {
    var h = cur + (tab && tab !== 'parts' ? '/' + tab : '');
    if (location.hash.slice(1) === h) return;
    try { history.replaceState(null, '', '#' + h); } catch (e) {}
  }

  tree.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-id]');
    if (!a) return;
    e.preventDefault();
    go(a.dataset.id);
  });
  view.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-jump]');
    if (!a) return;
    e.preventDefault();
    go(a.dataset.jump, 'compare');
  });
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.dataset.tab;
    draw();
    주소쓰기();
  });
  document.getElementById('q').addEventListener('input', function () {
    drawTree(this.value);
  });
  document.getElementById('menu').addEventListener('click', function () {
    document.body.classList.toggle('open');
  });

  /* 화면 모드 : 밝게 · 어둡게 · 자동 */
  (function theme() {
    var box = document.querySelector('.theme');
    if (!box) return;
    function set(v, save) {
      if (v === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', v);
      [].forEach.call(box.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', b.dataset.t === v);
      });
      if (save) { try { localStorage.setItem('sop-theme', v); } catch (e) {} }
    }
    var saved = 'auto';
    try { saved = localStorage.getItem('sop-theme') || 'auto'; } catch (e) {}
    set(saved, false);
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-t]');
      if (b) set(b.dataset.t, true);
    });
  })();

  var 처음 = (location.hash || '').slice(1).split('/');
  go(처음[0] || 'c02', 처음[1]);
})();
</script>
