<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2544">
<title>사전작업 허가 · 위험성평가 교육 확인 서명부</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/slide.css">
<link rel="stylesheet" href="assets/inline.css">
<link rel="stylesheet" href="assets/export.css">
<link rel="stylesheet" href="assets/sign.css">
<link rel="stylesheet" href="assets/day.css">
</head>
<body>
<div id="app"></div>

<script src="assets/data.js"></script>
<script src="assets/imglist.js"></script>
<script src="assets/app.js"></script>
<script src="assets/inline.js"></script>
<script src="assets/html-to-image.js"></script>
<script src="assets/export.js"></script>
<script src="assets/sign.js"></script>
<script src="assets/day.js"></script>
<script>
(function () {
  var t = currentTask(); if (!t) return;
  var KEY = 'report:' + t.id, LKEY = 'report:saved';
  var B = 'TASKS.' + t.id, R = SITE.report;
  document.title = t.name + ' 사전작업 허가 서명부';

  /* 일일 작업 보고서(묶음)의 일부로 열렸는가.
     그렇다면 날짜 · 장소 · 책임자 · 참여자 · 교육확인 · 서명은 묶음 값이 이긴다.
     서명을 한 번만 받아도 모든 작업의 보고서에 똑같이 들어가는 이유가 여기다. */
  var DAY = (window.dayCtx ? dayCtx() : null);

  var data;
  if (DAY) {
    data = {
      f: {
        name: t.name,
        date: DAY.date || todayStr(),
        place: DAY.place || t.place,
        leader: DAY.leader || '',
        crew: (DAY.crew || []).filter(function (c) { return c && c.name; })
                .map(function (c) { return c.name; }).join(', '),
        sitename: DAY.sitename || '',
        opinion: DAY.opinion || '',
        opinChk: !!DAY.opinChk,
        opinNone: !!DAY.opinNone
      },
      photos: (DAY.photos && DAY.photos[t.id]) || {},
      sigs: {}, crewSigs: {}, chk: DAY.chk || {}
    };
    if ((DAY.sigs || {}).writer) data.sigs[0] = DAY.sigs.writer;
    if ((DAY.sigs || {}).approver) data.sigs[1] = DAY.sigs.approver;
    /* 확인란 성명 — 0 작성자 / 1 승인자(결재권자) */
    data.f.sign_0 = DAY.writer || '';
    data.f.sign_1 = (DAY.approver && DAY.approver.name) || '';
    (DAY.crew || []).forEach(function (c, i) {
      data.f['cw_org_' + i] = (c && c.org) || '';
      data.f['cw_nm_' + i] = (c && c.name) || '';
      if (c && c.sig) data.crewSigs[i] = c.sig;
    });
  } else {
    data = store.get(KEY) || {};
  }
  data.f = data.f || {}; data.photos = data.photos || {};
  data.sigs = data.sigs || {};      /* 확인란 서명 : 0 작성자 / 1 승인자 */
  data.crewSigs = data.crewSigs || {};  /* 참여자 서명 */
  data.chk = data.chk || {};

  /* 참여자 줄 수 — 묶음에 사람이 더 많으면 그만큼 늘린다 */
  var crewRows = DAY ? Math.max(R.crewRows, (DAY.crew || []).length) : R.crewRows;

  function saveDay() {
    DAY.date = data.f.date; DAY.place = data.f.place;
    DAY.leader = data.f.leader; DAY.sitename = data.f.sitename;
    if (data.f.sign_0 != null) DAY.writer = data.f.sign_0;   /* 작성자 성명 */
    DAY.opinion = data.f.opinion;
    DAY.opinChk = !!data.f.opinChk; DAY.opinNone = !!data.f.opinNone;
    DAY.chk = data.chk;
    DAY.photos = DAY.photos || {};
    DAY.photos[t.id] = data.photos;
    DAY.sigs = DAY.sigs || {};
    if (data.sigs[0]) DAY.sigs.writer = data.sigs[0]; else delete DAY.sigs.writer;
    /* 결재(승인자) 서명은 결재 화면에서만 받는다 — 여기서는 건드리지 않는다 */
    var crew = [];
    for (var i = 0; i < crewRows; i++) {
      var org = data.f['cw_org_' + i] || '', nm = data.f['cw_nm_' + i] || '';
      var sg = data.crewSigs[i] || '';
      if (org || nm || sg) crew[i] = { org: org, name: nm, sig: sg };
    }
    for (var j = 0; j < crew.length; j++) if (!crew[j]) crew[j] = { org: '', name: '', sig: '' };
    DAY.crew = crew;
    return daySet(DAY);
  }

  function save() {
    var ok = DAY ? saveDay() : store.set(KEY, data);
    var el = document.getElementById('savedAt');
    if (!el) return;
    el.textContent = ok
      ? (DAY ? '· 일일 작업 보고서에 저장됨' : '· 자동 저장됨')
      : '⚠ 용량이 커서 자동 저장 실패 — [파일로 저장] 을 사용하세요';
  }
  /* ro : 일일 보고서가 주인인 칸. 묶음으로 열렸을 때는 여기서 고치지 못하게 막는다.
     (여기서 고쳐도 묶음에 되돌려 담을 자리가 없어 그냥 사라지기 때문) */
  function cell(k, ph, ro) {
    return '<td><input data-f="' + k + '" placeholder="' + esc(ph || '') + '"' +
      ((ro && DAY) ? ' readonly title="일일 작업 보고서 화면에서 고칩니다"' : '') + '></td>';
  }
  function lab(k, txt) { return '<th' + EA('SITE.report.' + k) + '>' + esc(txt) + '</th>'; }

  var h = snav(t.no + '. ' + t.name + ' — 사전작업 허가 서명부', 'work.html?id=' + t.id);
  h += '<div class="stage"><div class="slide dense">';
  h += sHead('<span' + EA('SITE.report.title') + '>' + esc(R.title) + '</span>',
             '<span' + EA('SITE.report.subtitle') + '>' + esc(R.subtitle) + '</span>', true);
  h += '<div class="s-body">';

  /* ── 상단 정보 ── */
  h += '<div class="thint noprint">표를 옆으로 밀어서 보세요</div>' +
    '<div class="tblscroll"><table class="rp-info">' +
    '<tr>' + lab('fields.0', R.fields[0]) + cell('name', t.name, true) +
             lab('fields.1', R.fields[1]) + cell('date', todayStr()) +
             lab('fields.2', R.fields[2]) + cell('place', t.place) + '</tr>' +
    '<tr>' + lab('fields.3', R.fields[3]) + cell('leader') +
             lab('fields.4', R.fields[4]) + cell('crew', '', true) +
             lab('fields.5', R.fields[5]) + cell('sitename') + '</tr></table></div>';

  h += '<div class="rp-main">';

  /* ── 왼쪽 : 사진 4종 + 서약문 ── */
  h += '<div class="rp-left"><div class="rp-photos">';
  R.slots.forEach(function (s, i) {
    h += '<div class="rp-slot">' +
      '<div class="rp-sh"><span class="sq">' + s.n + '</span>' +
      '<b' + EA('SITE.report.slots.' + i + '.name') + '>' + esc(s.name) + '</b>' +
      '<em' + EA('SITE.report.slots.' + i + '.desc') + '>' + esc(s.desc) + '</em></div>' +
      '<label class="rp-drop" data-slot="' + s.n + '">' +
        '<input type="file" accept="image/*" hidden data-slot="' + s.n + '">' +
        '<input type="file" accept="image/*" capture="environment" hidden data-cam="' + s.n + '">' +
        '<span class="txt"><b class="noprint">+ 사진 추가</b>' + s.n + '. ' + esc(s.name) + '</span>' +
      '</label>' +
      '<div class="noprint" style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">' +
        '<button type="button" class="sfbtn" data-act="cam" data-slot="' + s.n + '">📷 사진 찍기</button>' +
        '<button type="button" class="sfbtn" data-act="change" data-slot="' + s.n + '">📁 파일</button>' +
        '<button type="button" class="sfbtn" data-act="clear" data-slot="' + s.n + '">삭제</button></div>' +
      '<em class="rp-st noprint" data-st="' + s.n + '"></em>' +
      '</div>';
  });
  h += '</div>';

  h += '<div class="rp-pledge">' +
    '<p' + EA('SITE.report.pledge', 'multi') + '>' + esc(R.pledge).replace(/\n/g, '<br>') + '</p>' +
    '<div class="rp-opin">' +
    '<label class="rp-cb"><input type="checkbox" data-f="opinChk"><i class="cbx"></i><span' + EA('SITE.report.opinion') + '>' +
      esc(R.opinion) + '</span></label>' +
    '<input class="rp-opin-in" data-f="opinion">' +
    '<label class="rp-cb"><input type="checkbox" data-f="opinNone"><i class="cbx"></i><span' + EA('SITE.report.opinionNone') + '>' +
      esc(R.opinionNone) + '</span></label>' +
    '</div></div>';
  h += '</div>';

  /* ── 오른쪽 : 교육 체크 · 참여자 서명부 · 확인 ── */
  h += '<div class="rp-side">';
  h += '<div class="pnl"><div class="pnl-h">' +
    '<span' + EA('SITE.report.checkTitle') + '>' + esc(R.checkTitle) + '</span>' +
    '<em' + EA('SITE.report.checkNote') + '>' + esc(R.checkNote) + '</em></div>' +
    '<div class="pnl-b rp-chk">' +
    R.checks.map(function (c, i) {
      return '<label class="rp-chkrow"><input type="checkbox" data-chk="' + i + '"><i class="cbx"></i>' +
        '<span' + EA('SITE.report.checks.' + i) + '>' + esc(c) + '</span></label>';
    }).join('') + '</div></div>';

  h += '<div class="pnl"><div class="pnl-h">' +
    '<span' + EA('SITE.report.crewTitle') + '>' + esc(R.crewTitle) + '</span>' +
    '<em' + EA('SITE.report.crewNote') + '>' + esc(R.crewNote) + '</em></div>' +
    '<div class="pnl-b" style="padding:.5em">' +
    '<table class="rp-crew"><tr>' +
    R.crewHead.map(function (x, i) { return '<th' + EA('SITE.report.crewHead.' + i) + '>' + esc(x) + '</th>'; }).join('') +
    '</tr>';
  for (var i = 0; i < crewRows; i++) {
    h += '<tr><th>' + (i + 1) + '</th>' +
      '<td><input data-f="cw_org_' + i + '"></td>' +
      '<td><input data-f="cw_nm_' + i + '"></td>' +
      '<td style="padding:.15em"><div class="sigbox sm" data-csig="' + i + '"><span class="ph">서명</span></div></td></tr>';
  }
  h += '</table></div></div>';

  h += '<div class="pnl"><div class="pnl-h"' + EA('SITE.report.signTitle') + '>' + esc(R.signTitle) + '</div>' +
    '<div class="pnl-b" style="padding:.5em">' +
    '<table class="rp-sign"><tr>' +
    R.signHead.map(function (x, i) { return '<th' + EA('SITE.report.signHead.' + i) + '>' + esc(x) + '</th>'; }).join('') +
    '</tr>' +
    R.signs.map(function (nm, i) {
      return '<tr><th' + EA('SITE.report.signs.' + i) + '>' + esc(nm) + '</th>' +
        '<td><input data-f="sign_' + i + '" placeholder="성명"' +
        ((DAY && i === 1) ? ' readonly title="결재 화면에서 들어옵니다"' : '') + '></td>' +
        '<td style="padding:.15em"><div class="sigbox" data-sig="' + i + '"><span class="ph">눌러서 서명</span></div></td></tr>';
    }).join('') + '</table></div></div>';
  h += '</div></div>';

  h += '<p class="rp-note"><span' + EA('SITE.report.legal', 'multi') + '>' +
    esc(R.legal).replace(/\n/g, '<br>') + '</span>' +
    '<span id="savedAt" class="noprint" style="color:#94a3b8">　</span></p>';
  h += '</div><div class="s-foot"><span' + EA('SITE.report.foot') + '>' + esc(R.foot) + '</span></div></div>';

  if (DAY) {
    var dq = '?id=' + t.id + '&day=' + encodeURIComponent(DAY.id);
    h += '<div class="btnbar noprint" style="max-width:1180px;margin:0 auto 30px;padding:0 12px">' +
      '<a class="btn" href="risk' + dq + '">‹ 위험성평가표</a>' +
      '<a class="btn primary" href="day.html?d=' + encodeURIComponent(DAY.id) + '">일일 작업 보고서로 돌아가기 ›</a>' +
      '</div>';
  } else {
    h += '<div class="btnbar noprint" style="max-width:1180px;margin:0 auto 8px;padding:0 12px">' +
      '<button class="btn primary" id="btnSaveRec">💾 이 보고서 저장</button>' +
      '<button class="btn" id="btnOpenRec">📂 저장된 보고서</button>' +
      '<button class="btn" id="btnFileSave">⤓ 파일로 저장</button>' +
      '<label class="btn" style="cursor:pointer">📁 파일 열기<input type="file" accept=".json" hidden id="fileRec"></label>' +
      '</div>';
    h += '<div class="btnbar noprint" style="max-width:1180px;margin:0 auto 30px;padding:0 12px">' +
      '<a class="btn" href="risk.html?id=' + t.id + '">‹ 위험성평가표</a>' +
      '<button class="btn ghost" id="btnReset">새로 작성 (전체 지우기)</button>' +
      '<a class="btn primary" href="work.html?id=' + t.id + '">작업 메뉴 ›</a></div>';
  }
  h += '</div>';

  document.getElementById('app').innerHTML = h;
  initInline();

  /* ── 입력값 복원 ── */
  document.querySelectorAll('[data-f]').forEach(function (el) {
    var k = el.dataset.f;
    if (el.type === 'checkbox') {
      if (data.f[k]) el.checked = true;
      el.addEventListener('change', function () { data.f[k] = el.checked; save(); });
    } else {
      if (data.f[k] != null) el.value = data.f[k];
      el.addEventListener('input', function () { data.f[k] = el.value; save(); });
    }
  });
  document.querySelectorAll('[data-chk]').forEach(function (el) {
    var k = el.dataset.chk;
    if (data.chk[k]) el.checked = true;
    el.addEventListener('change', function () { data.chk[k] = el.checked; save(); });
  });

  /* ── 현장 사진 ── */
  function renderPhoto(n) {
    var d = document.querySelector('.rp-drop[data-slot="' + n + '"]');
    if (!d) return;
    var old = d.querySelector('img'); if (old) old.remove();
    var txt = d.querySelector('.txt');
    if (data.photos[n]) {
      var img = new Image(); img.src = data.photos[n]; img.alt = '';
      d.appendChild(img); txt.style.display = 'none';
    } else txt.style.display = '';
  }
  function photoState(n, msg, bad) {
    var e = document.querySelector('[data-st="' + n + '"]');
    if (!e) return;
    e.textContent = msg || '';
    e.style.color = bad ? '#b91c1c' : '#64748b';
  }

  /* 사진 한 장 넣기.
     묶음(일일 보고서)으로 열렸을 때는 고르는 즉시 서버로 올리고 주소만 저장한다.
     그림째로 브라우저에 담으면 저장 한도를 넘겨 사진이 사라지기 때문이다. */
  function putPhoto(n, f) {
    if (!f) return;
    if (!/^image\//.test(f.type || '')) { photoState(n, '사진 파일이 아닙니다.', true); return; }
    if (DAY) {
      dayPhotoSave(DAY, t.id, n, f, function (st) {
        if (st.busy) { photoState(n, '올리는 중입니다...'); return; }
        if (st.url) { data.photos[n] = st.url; renderPhoto(n); }
        photoState(n, st.err ? ('⚠ ' + st.err) : '올렸습니다', !!st.err);
        var el = document.getElementById('savedAt');
        if (el && !st.err) el.textContent = '· 일일 작업 보고서에 저장됨';
      });
      return;
    }
    fileToDataURL(f, function (url) {
      data.photos[n] = url; renderPhoto(n); save();
      photoState(n, '넣었습니다');
    });
  }

  document.querySelectorAll('input[type=file][data-slot],input[type=file][data-cam]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      inp.value = '';                         /* 같은 사진을 다시 골라도 반응하게 */
      putPhoto(inp.dataset.slot || inp.dataset.cam, f);
    });
  });
  document.querySelectorAll('.rp-drop').forEach(function (d) {
    ['dragenter', 'dragover'].forEach(function (e) {
      d.addEventListener(e, function (ev) { ev.preventDefault(); d.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(function (e) {
      d.addEventListener(e, function (ev) { ev.preventDefault(); d.classList.remove('dragover'); });
    });
    d.addEventListener('drop', function (ev) {
      var f = ev.dataTransfer.files && ev.dataTransfer.files[0];
      putPhoto(d.dataset.slot, f);
    });
  });
  document.querySelectorAll('.sfbtn').forEach(function (b) {
    b.addEventListener('click', function (ev) {
      ev.preventDefault();
      var n = b.dataset.slot, act = b.dataset.act;
      if (act === 'clear') {
        delete data.photos[n]; renderPhoto(n);
        if (DAY) { dayPhotoDel(DAY, t.id, n); photoState(n, '지웠습니다'); } else save();
      } else if (act === 'cam') {
        document.querySelector('input[type=file][data-cam="' + n + '"]').click();
      } else {
        document.querySelector('input[type=file][data-slot="' + n + '"]').click();
      }
    });
  });

  /* ── 손글씨 서명 (확인란 · 참여자) ── */
  function paintSig(box, val, ph) {
    if (val) { box.classList.add('has'); box.innerHTML = '<img src="' + val + '" alt="서명">'; }
    else { box.classList.remove('has'); box.innerHTML = '<span class="ph">' + ph + '</span>'; }
  }
  function renderSig(i) {
    var box = document.querySelector('.sigbox[data-sig="' + i + '"]');
    if (box) paintSig(box, data.sigs[i], '눌러서 서명');
  }
  function renderCrewSig(i) {
    var box = document.querySelector('.sigbox[data-csig="' + i + '"]');
    if (box) paintSig(box, data.crewSigs[i], '서명');
  }
  document.querySelectorAll('.sigbox').forEach(function (box) {
    box.addEventListener('click', function () {
      if (document.body.classList.contains('edit-on')) return;
      var isCrew = box.dataset.csig != null;
      var i = isCrew ? box.dataset.csig : box.dataset.sig;
      var cur = isCrew ? data.crewSigs[i] : data.sigs[i];
      var title = isCrew ? ('참여자 ' + (+i + 1) + ' 확인 서명') : ((R.signs[i] || '') + ' 확인 서명');
      signPad(title, cur, function (v) {
        if (v === undefined) return;
        if (isCrew) { if (v === null) delete data.crewSigs[i]; else data.crewSigs[i] = v; renderCrewSig(i); }
        else { if (v === null) delete data.sigs[i]; else data.sigs[i] = v; renderSig(i); }
        save();
      });
    });
  });

  /* ── 저장 / 불러오기 ──
     묶음(일일 작업 보고서)으로 열렸을 때는 묶음이 알아서 저장하므로 이 단추들을 만들지 않는다. */
  if (!DAY) {
  function snapshot() {
    return {
      v: 2, task: t.id, taskName: t.name,
      title: (data.f.name || t.name) + ' · ' + (data.f.date || todayStr()),
      at: new Date().toISOString(),
      data: JSON.parse(JSON.stringify(data))
    };
  }
  function recs() { return store.get(LKEY) || []; }
  function setRecs(a) { return store.set(LKEY, a); }

  document.getElementById('btnSaveRec').addEventListener('click', function () {
    var rec = snapshot();
    var name = prompt('저장할 이름을 확인하세요.', rec.title);
    if (name === null) return;
    rec.title = name.trim() || rec.title;
    rec.id = 'r' + Date.now();
    var a = recs(); a.unshift(rec);
    if (!setRecs(a)) {
      alert('브라우저 저장 공간이 부족합니다.\n\n오래된 보고서를 [저장된 보고서] 에서 지우거나,\n' +
            '[⤓ 파일로 저장] 으로 파일에 보관하세요.');
      return;
    }
    toast('보고서를 저장했습니다 — ' + rec.title);
  });

  document.getElementById('btnOpenRec').addEventListener('click', function () {
    var a = recs();
    var mask = document.createElement('div');
    mask.className = 'rec-mask';
    mask.innerHTML = '<div class="rec"><div class="rec-h"><b>저장된 보고서</b>' +
      '<button type="button" class="sg-btn" id="recX">닫기</button></div>' +
      '<div class="rec-b">' + (a.length ? a.map(function (r, i) {
        return '<div class="rec-i"><div class="t"><b>' + esc(r.title) + '</b>' +
          '<span>' + esc(r.taskName || '') + ' · 저장 ' + esc(new Date(r.at).toLocaleString('ko-KR')) + '</span></div>' +
          '<button type="button" class="sg-btn pri" data-load="' + i + '">불러오기</button>' +
          '<button type="button" class="sg-btn del" data-del="' + i + '">삭제</button></div>';
      }).join('') : '<div class="rec-empty">저장된 보고서가 없습니다.</div>') + '</div>' +
      '<div class="rec-f"><span class="rec-note">이 브라우저에만 저장됩니다. ' +
      '다른 PC 에서도 쓰려면 [⤓ 파일로 저장] 을 이용하세요.</span></div></div>';
    document.body.appendChild(mask);
    function close() { mask.remove(); }
    mask.addEventListener('click', function (e) { if (e.target === mask || e.target.closest('#recX')) close(); });
    mask.querySelectorAll('[data-load]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = recs()[+b.dataset.load]; if (!r) return;
        if (!confirm('현재 작성 중인 내용을 덮어씁니다. 불러올까요?')) return;
        store.set(KEY, r.data); close(); location.reload();
      });
    });
    mask.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('이 보고서를 삭제합니다.')) return;
        var a2 = recs(); a2.splice(+b.dataset.del, 1); setRecs(a2); close();
        document.getElementById('btnOpenRec').click();
      });
    });
  });

  document.getElementById('btnFileSave').addEventListener('click', function () {
    var rec = snapshot();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(rec)], { type: 'application/json' }));
    a.download = '서명부_' + (data.f.name || t.name).replace(/[\\/:*?"<>|]/g, '_') +
      '_' + (data.f.date || todayStr()).replace(/[^0-9]/g, '') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('파일로 저장했습니다');
  });
  document.getElementById('fileRec').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = '';
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var r = JSON.parse(fr.result);
        if (!r || !r.data) throw new Error('보고서 파일이 아닙니다');
        if (!confirm('현재 작성 중인 내용을 덮어씁니다. 불러올까요?\n\n' + (r.title || ''))) return;
        store.set(KEY, r.data); location.reload();
      } catch (e) { alert('파일을 읽지 못했습니다 : ' + e.message); }
    };
    fr.readAsText(f, 'utf-8');
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    if (!confirm('작성 중인 내용과 사진 · 서명을 모두 지우고 새로 작성합니다.\n저장해 둔 보고서는 지워지지 않습니다.')) return;
    store.del(KEY); location.reload();
  });

  }

  R.slots.forEach(function (s) { renderPhoto(s.n); });
  R.signs.forEach(function (_, i) { renderSig(i); });
  for (var ci = 0; ci < crewRows; ci++) renderCrewSig(ci);
  if (DAY) document.getElementById('savedAt').textContent =
    '· 일일 작업 보고서 ' + esc(DAY.date) + ' 의 공통 내용을 가져왔습니다';
  else if (store.get(KEY)) document.getElementById('savedAt').textContent = '· 이 브라우저에 저장된 내용을 불러왔습니다';
})();
</script>

.sfbtn{border:1px solid #d5dce5;background:#fff;border-radius:6px;padding:3px 9px;font-size:11.5px;
  color:#475569;cursor:pointer;font-family:inherit;font-weight:600}
.sfbtn:hover{background:#f1f5f9}
</style>
</body>
